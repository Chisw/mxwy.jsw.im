key: ti-dao
sentences:
  - time: 00:00.39
    text: 体道 第一
    pinyin: tǐ dào dì yī
  - time: 00:03.75
    text: 道可道，非常道。
    pinyin: dào kě dào fēi cháng dào
  - time: 00:07.21
    text: 名可名，非常名。
    pinyin: míng kě míng fēi cháng míng
  - time: 00:11.53
    text: 无名，天地之始。
    pinyin: wú míng tiān dì zhī shǐ
  - time: 00:14.95
    text: 有名，万物之母。
    pinyin: yǒu míng wàn wù zhī mǔ
  - time: 00:19.10
    text: 故常无欲，以观其妙；
    pinyin: gù cháng wú yù yǐ guān qí miào
  - time: 00:22.80
    text: 常有欲，以观其徼。
    pinyin: cháng yǒu yù yǐ guān qí jiào
  - time: 00:27.20
    text: 此两者，同出而异名，
    pinyin: cǐ liǎng zhě tóng chū ér yì míng
  - time: 00:31.49
    text: 同谓之玄，
    pinyin: tóng wèi zhī xuán
  - time: 00:33.87
    text: 玄之又玄，
    pinyin: xuán zhī yòu xuán
  - time: 00:36.20
    text: 众妙之门。
    pinyin: zhòng miào zhī mén
