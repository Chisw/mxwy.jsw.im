key: yu-you-shi
sections:
  - 段一@1,27
  - 段二@28,59
  - 段三@60,75
sentences:
  - time: 00:00.22
    text: 余幼时即嗜学。
    pinyin: yú yòu shí jí shì xué
  - time: 00:03.49
    text: 家贫，无从致书以观，
    pinyin: jiā pín wú cóng zhì shū yǐ guān
  - time: 00:07.09
    text: 每假借于藏书之家，
    pinyin: měi jiǎ jiè yú cáng shū zhī jiā
  - time: 00:10.49
    text: 手自笔录，计日以还。
    pinyin: shǒu zì bǐ lù jì rì yǐ huán
  - time: 00:14.47
    text: 天大寒，砚冰坚，
    pinyin: tiān dà hán yàn bīng jiān
  - time: 00:17.78
    text: 手指不可屈伸，弗之怠。
    pinyin: shǒu zhǐ bù kě qū shēn fú zhī dài
  - time: 00:21.87
    text: 录毕，走送之，
    pinyin: lù bì zǒu sòng zhī
  - time: 00:24.92
    text: 不敢稍逾约。
    pinyin: bù gǎn shāo yú yuē
  - time: 00:26.97
    text: 以是人多以书假余，
    pinyin: yǐ shì rén duō yǐ shū jiǎ yú
  - time: 00:31.34
    text: 余因得遍观群书。
    pinyin: yú yīn dé biàn guān qún shū
  - time: 00:35.07
    text: 既加冠，
    pinyin: jì jiā guān
  - time: 00:36.90
    text: 益慕圣贤之道。
    pinyin: yì mù shèng xián zhī dào
  - time: 00:39.47
    text: 又患无硕师名人与游，
    pinyin: yòu huàn wú shuò shī míng rén yǔ yóu
  - time: 00:43.29
    text: 尝趋百里外，
    pinyin: cháng qū bǎi lǐ wài
  - time: 00:45.50
    text: 从乡之先达执经叩问。
    pinyin: cóng xiāng zhī xiān dá zhí jīng kòu wèn
  - time: 00:49.25
    text: 先达德隆望尊，
    pinyin: xiān dá dé lóng wàng zūn
  - time: 00:52.09
    text: 门人弟子填其室，
    pinyin: mén rén dì zǐ tián qí shì
  - time: 00:55.24
    text: 未尝稍降辞色。
    pinyin: wèi cháng shāo jiàng cí sè
  - time: 00:58.25
    text: 余立侍左右，
    pinyin: yú lì shì zuǒ yòu
  - time: 01:01.14
    text: 援疑质理，
    pinyin: yuán yí zhì lǐ
  - time: 01:03.13
    text: 俯身倾耳以请；
    pinyin: fǔ shēn qīng ěr yǐ qǐng
  - time: 01:05.90
    text: 或遇其叱咄，
    pinyin: huò yù qí chì duō
  - time: 01:08.57
    text: 色愈恭，礼愈至，
    pinyin: sè yù gōng lǐ yù zhì
  - time: 01:11.60
    text: 不敢出一言以复；
    pinyin: bù gǎn chū yì yán yǐ fù
  - time: 01:14.15
    text: 俟其欣悦，则又请焉。
    pinyin: sì qí xīn yuè zé yòu qǐng yān
  - time: 01:18.00
    text: 故余虽愚，
    pinyin: gù yú suī yú
  - time: 01:20.39
    text: 卒获有所闻。
    pinyin: zú huò yǒu suǒ wén
  - time: 01:22.78
    text: 当余之从师也，
    pinyin: dāng yú zhī cóng shī yě
  - time: 01:26.07
    text: 负箧曳屣，
    pinyin: fù qiè yè xǐ
  - time: 01:28.04
    text: 行深山巨谷中。
    pinyin: xíng shēn shān jù gǔ zhōng
  - time: 01:30.81
    text: 穷冬烈风，
    pinyin: qióng dōng liè fēng
  - time: 01:33.22
    text: 大雪深数尺，
    pinyin: dà xuě shēn shù chǐ
  - time: 01:35.52
    text: 足肤皲裂而不知。
    pinyin: zú fū jūn liè ér bù zhī
  - time: 01:38.90
    text: 至舍，
    pinyin: zhì shè
  - time: 01:40.64
    text: 四支僵劲不能动，
    pinyin: sì zhī jiāng jìn bù néng dòng
  - time: 01:43.52
    text: 媵人持汤沃灌，
    pinyin: yìng rén chí tāng wò guàn
  - time: 01:46.32
    text: 以衾拥覆，
    pinyin: yǐ qīn yōng fù
  - time: 01:48.11
    text: 久而乃和。
    pinyin: jiǔ ér nǎi hé
  - time: 01:50.18
    text: 寓逆旅主人，
    pinyin: yù nì lǚ zhǔ rén
  - time: 01:53.22
    text: 日再食，
    pinyin: rì zài shí
  - time: 01:54.94
    text: 无鲜肥滋味之享。
    pinyin: wú xiān féi zī wèi zhī xiǎng
  - time: 01:57.78
    text: 同舍生皆被绮绣，
    pinyin: tóng shè shēng jiē pī qǐ xiù
  - time: 02:01.04
    text: 戴朱缨宝饰之帽，
    pinyin: dài zhū yīng bǎo shì zhī mào
  - time: 02:03.68
    text: 腰白玉之环，
    pinyin: yāo bái yù zhī huán
  - time: 02:06.15
    text: 左佩刀，右备容臭，
    pinyin: zuǒ pèi dāo yòu pèi róng xiù
  - time: 02:09.40
    text: 煜然若神人；
    pinyin: yù rán ruò shén rén
  - time: 02:11.97
    text: 余则缊袍敝衣处其间，
    pinyin: yú zé yùn páo bì yī chǔ qí jiān
  - time: 02:15.94
    text: 略无慕艳意，
    pinyin: luè wú mù yàn yì
  - time: 02:18.39
    text: 以中有足乐者，
    pinyin: yǐ zhōng yǒu zú lè zhě
  - time: 02:21.19
    text: 不知口体之奉不若人也。
    pinyin: bù zhī kǒu tǐ zhī fèng bú ruò rén yě
  - time: 02:24.91
    text: 盖余之勤且艰若此。
    pinyin: gài yú zhī qín qiě jiān ruò cǐ
  - time: 02:29.17
    text: 今虽耄老，
    pinyin: jīn suī mào lǎo
  - time: 02:31.23
    text: 未有所成，
    pinyin: wèi yǒu suǒ chéng
  - time: 02:33.00
    text: 犹幸预君子之列，
    pinyin: yóu xìng yù jūn zǐ zhī liè
  - time: 02:35.97
    text: 而承天子之宠光，
    pinyin: ér chéng tiān zǐ zhī chǒng guāng
  - time: 02:38.72
    text: 缀公卿之后，
    pinyin: zhuì gōng qīng zhī hòu
  - time: 02:40.69
    text: 日侍坐备顾问，
    pinyin: rì shì zuò bèi gù wèn
  - time: 02:43.85
    text: 四海亦谬称其氏名，
    pinyin: sì hǎi yì miù chēng qí shì míng
  - time: 02:47.27
    text: 况才之过于余者乎？
    pinyin: kuàng cái zhī guò yú yú zhě hū
  - time: 02:51.82
    text: 今诸生学于太学，
    pinyin: jīn zhū shēng xué yú tài xué
  - time: 02:55.35
    text: 县官日有廪稍之供，
    pinyin: xiàn guān rì yǒu lǐn shāo zhī gōng
  - time: 02:58.47
    text: 父母岁有裘葛之遗，
    pinyin: fù mǔ suì yǒu qiú gé zhī wèi
  - time: 03:02.07
    text: 无冻馁之患矣；
    pinyin: wú dòng něi zhī huàn yǐ
  - time: 03:04.64
    text: 坐大厦之下而诵诗书，
    pinyin: zuò dà shà zhī xià ér sòng shī shū
  - time: 03:08.52
    text: 无奔走之劳矣；
    pinyin: wú bēn zǒu zhī láo yǐ
  - time: 03:11.04
    text: 有司业、博士为之师，
    pinyin: yǒu sī yè bó shì wéi zhī shī
  - time: 03:15.28
    text: 未有问而不告、求而不得者也；
    pinyin: wèi yǒu wèn ér bù gào qiú ér bù dé zhě yě
  - time: 03:20.40
    text: 凡所宜有之书，
    pinyin: fán suǒ yí yǒu zhī shū
  - time: 03:23.13
    text: 皆集于此，
    pinyin: jiē jí yú cǐ
  - time: 03:25.08
    text: 不必若余之手录，
    pinyin: bù bì ruò yú zhī shǒu lù
  - time: 03:27.93
    text: 假诸人而后见也。
    pinyin: jiǎ zhū rén ér hòu jiàn yě
  - time: 03:31.65
    text: 其业有不精、德有不成者，
    pinyin: qí yè yǒu bù jīng dé yǒu bù chéng zhě
  - time: 03:35.78
    text: 非天质之卑，
    pinyin: fēi tiān zhì zhī bēi
  - time: 03:37.93
    text: 则心不若余之专耳，
    pinyin: zé xīn bù ruò yú zhī zhuān ěr
  - time: 03:41.09
    text: 岂他人之过哉！
    pinyin: qǐ tā rén zhī guò zāi
