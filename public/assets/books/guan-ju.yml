key: guan-ju
sentences:
  - time: 00:01.00
    text: 关雎 周南
    pinyin: guān jū zhōu nán
  - time: 00:05.34
    text: 关关雎鸠，在河之洲。
    pinyin: guān guān jū jiū zài hé zhī zhōu
  - time: 00:11.10
    text: 窈窕淑女，君子好逑。
    pinyin: yǎo tiǎo shū nǚ jūn zǐ hǎo qiú
  - time: 00:16.33
    text: 参差荇菜，左右流之。
    pinyin: cēn cī xìng cài zuǒ yòu liú zhī
  - time: 00:21.14
    text: 窈窕淑女，寤寐求之。
    pinyin: yǎo tiǎo shū nǚ wù mèi qiú zhī
  - time: 00:26.28
    text: 求之不得，寤寐思服。
    pinyin: qiú zhī bù dé wù mèi sī fú
  - time: 00:30.86
    text: 悠哉悠哉，辗转反侧。
    pinyin: yōu zāi yōu zāi zhǎn zhuǎn fǎn cè
  - time: 00:36.48
    text: 参差荇菜，左右采之。
    pinyin: cēn cī xìng cài zuǒ yòu cǎi zhī
  - time: 00:41.28
    text: 窈窕淑女，琴瑟友之。
    pinyin: yǎo tiǎo shū nǚ qín sè yǒu zhī
  - time: 00:46.77
    text: 参差荇菜，左右芼之。
    pinyin: cēn cī xìng cài zuǒ yòu mào zhī
  - time: 00:51.83
    text: 窈窕淑女，钟鼓乐之。
    pinyin: yǎo tiǎo shū nǚ zhōng gǔ lè zhī
