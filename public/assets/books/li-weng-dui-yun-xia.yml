sentences:
  - time: 00:00.60
    text: 一 先
    pinyin: yī xiān
  - time: 00:02.42
    text: 寒对暑，日对年。
    pinyin: hán duì shǔ rì duì nián
  - time: 00:05.71
    text: 蹴踘对秋千。
    pinyin: cù jū duì qiū qiān
  - time: 00:08.28
    text: 丹山对碧水，淡雨对覃烟。
    pinyin: dān shān duì bì shuǐ dàn yǔ duì tán yān
  - time: 00:13.68
    text: 歌宛转，貌婵娟。
    pinyin: gē wǎn zhuǎn mào chán juān
  - time: 00:17.05
    text: 雪鼓对云笺。
    pinyin: xuě gǔ duì yún jiān
  - time: 00:19.46
    text: 荒芦栖南雁，疏柳噪秋蝉。
    pinyin: huāng lú qī nán yàn shū liǔ zào qiū chán
  - time: 00:24.95
    text: 洗耳尚逢高士笑，折腰肯受小儿怜。
    pinyin: xǐ ěr shàng féng gāo shì xiào zhé yāo kěn shòu xiǎo ér lián
  - time: 00:31.83
    text: 郭泰泛舟，折角半垂梅子雨；
    pinyin: guō tài fàn zhōu zhé jiǎo bàn chuí méi zǐ yǔ
  - time: 00:37.13
    text: 山涛骑马，接篱倒着杏花天。
    pinyin: shān tāo qí mǎ jiē lí dào zhuó xìng huā tiān
  - time: 00:42.78
    text: 轻对重，脆对坚。
    pinyin: qīng duì zhòng cuì duì jiān
  - time: 00:46.83
    text: 碧玉对青钱。
    pinyin: bì yù duì qīng qián
  - time: 00:49.52
    text: 郊寒对岛瘦，酒圣对诗仙。
    pinyin: jiāo hán duì dǎo shòu jiǔ shèng duì shī xiān
  - time: 00:54.78
    text: 依玉树，步金莲。
    pinyin: yī yù shù bù jīn lián
  - time: 00:58.02
    text: 凿井对耕田。
    pinyin: záo jǐng duì gēng tián
  - time: 01:00.51
    text: 杜甫清宵立，边韶白昼眠。
    pinyin: dù fǔ qīng xiāo lì biān sháo bái zhòu mián
  - time: 01:06.03
    text: 豪饮客吞波底月，酣游人醉水中天。
    pinyin: háo yǐn kè tūn bō dǐ yuè hān yóu rén zuì shuǐ zhōng tiān
  - time: 01:13.07
    text: 斗草青郊，几行宝马嘶金勒；
    pinyin: dòu cǎo qīng jiāo jǐ háng bǎo mǎ sī jīn lè
  - time: 01:18.75
    text: 看花紫陌，千里香车拥翠钿。
    pinyin: kàn huā zǐ mò qiān lǐ xiāng chē yōng cuì tián
  - time: 01:24.81
    text: 吟对咏，授对传。
    pinyin: yín duì yǒng shòu duì chuán
  - time: 01:28.51
    text: 乐矣对凄然。
    pinyin: lè yǐ duì qī rán
  - time: 01:31.03
    text: 风鹏对雪雁，董杏对周莲。
    pinyin: fēng péng duì xuě yàn dǒng xìng duì zhōu lián
  - time: 01:36.09
    text: 春九十，岁三千。
    pinyin: chūn jiǔ shí suì sān qiān
  - time: 01:39.90
    text: 钟鼓对管弦。
    pinyin: zhōng gǔ duì guǎn xián
  - time: 01:42.20
    text: 入山逢宰相，无事即神仙。
    pinyin: rù shān féng zǎi xiàng wú shì jí shén xiān
  - time: 01:47.43
    text: 霞映武陵桃淡淡，烟荒隋堤柳绵绵。
    pinyin: xiá yìng wǔ líng táo dàn dàn yān huāng suí dī liǔ mián mián
  - time: 01:54.62
    text: 七碗月团，啜罢清风生腋下；
    pinyin: qī wǎn yuè tuán chuò bà qīng fēng shēng yè xià
  - time: 02:00.00
    text: 三杯云液，饮余红雨晕腮边。
    pinyin: sān bēi yún yè yǐn yú hóng yǔ yùn sāi biān
  - time: 02:05.83
    text: 中对外，后对先。
    pinyin: zhōng duì wài hòu duì xiān
  - time: 02:09.11
    text: 树下对花前。
    pinyin: shù xià duì huā qián
  - time: 02:11.54
    text: 玉柱对金屋，叠嶂对平川。
    pinyin: yù zhù duì jīn wū dié zhàng duì píng chuān
  - time: 02:16.70
    text: 孙子策，祖生鞭。
    pinyin: sūn zǐ cè zǔ shēng biān
  - time: 02:20.24
    text: 盛席对华筵。
    pinyin: shèng xí duì huá yán
  - time: 02:22.92
    text: 解醉知茶力，消愁识酒权。
    pinyin: jiě zuì zhī chá lì xiāo chóu shí jiǔ quán
  - time: 02:28.03
    text: 丝剪芰荷开冻沼，锦妆凫雁泛温泉。
    pinyin: sī jiǎn jì hé kāi dòng zhǎo jǐn zhuāng fú yàn fàn wēn quán
  - time: 02:35.22
    text: 帝女衔石，海中遗魄为精卫；
    pinyin: dì nǚ xián shí hǎi zhōng yí pò wéi jīng wèi
  - time: 02:40.95
    text: 蜀王叫月，枝上游魂化杜鹃。
    pinyin: shǔ wáng jiào yuè zhī shàng yóu hún huà dù juān
  - time: 02:47.51
    text: 二 萧
    pinyin: èr xiāo
  - time: 02:49.32
    text: 琴对管，釜对瓢。
    pinyin: qín duì guǎn fǔ duì piáo
  - time: 02:52.64
    text: 水怪对花妖。
    pinyin: shuǐ guài duì huā yāo
  - time: 02:55.02
    text: 秋声对春色，白缣对红绡。
    pinyin: qiū shēng duì chūn sè bái jiān duì hóng xiāo
  - time: 02:59.97
    text: 臣五代，事三朝。
    pinyin: chén wǔ dài shì sān cháo
  - time: 03:03.51
    text: 斗柄对弓腰。
    pinyin: dòu bǐng duì gōng yāo
  - time: 03:05.91
    text: 醉客歌金缕，佳人品玉箫。
    pinyin: zuì kè gē jīn lǚ jiā rén pǐn yù xiāo
  - time: 03:11.02
    text: 风定落花闲不扫，霜余残叶湿难烧。
    pinyin: fēng dìng luò huā xián bù sǎo shuāng yú cán yè shī nán shāo
  - time: 03:17.65
    text: 千载兴周，尚父一竿投渭水；
    pinyin: qiān zǎi xīng zhōu shàng fǔ yì gān tóu wèi shuǐ
  - time: 03:23.19
    text: 百年霸越，钱王万弩射江潮。
    pinyin: bǎi nián bà yuè qián wáng wàn nǔ shè jiāng cháo
  - time: 03:28.85
    text: 荣对悴，夕对朝。
    pinyin: róng duì cuì xī duì zhāo
  - time: 03:32.29
    text: 露地对云霄。
    pinyin: lù dì duì yún xiāo
  - time: 03:34.89
    text: 商彝对周鼎，殷濩对虞韶。
    pinyin: shāng yí duì zhōu dǐng yīn hù duì yú sháo
  - time: 03:40.16
    text: 樊素口，小蛮腰。
    pinyin: fán sù kǒu xiǎo mán yāo
  - time: 03:43.65
    text: 六诏对三苗。
    pinyin: liù zhào duì sān miáo
  - time: 03:46.14
    text: 朝天车奕奕，出塞马萧萧。
    pinyin: cháo tiān chē yì yì chū sài mǎ xiāo xiāo
  - time: 03:51.39
    text: 公子幽兰重泛舸，王孙芳草正联镳。
    pinyin: gōng zǐ yōu lán chóng fàn gě wáng sūn fāng cǎo zhèng lián biāo
  - time: 03:58.47
    text: 潘岳高怀，曾向秋天吟蟋蟀；
    pinyin: pān yuè gāo huái céng xiàng qiū tiān yín xī shuài
  - time: 04:03.99
    text: 王维清兴，尝于雪夜画芭蕉。
    pinyin: wáng wéi qīng xìng cháng yú xuě yè huà bā jiāo
  - time: 04:09.88
    text: 耕对读，牧对樵。
    pinyin: gēng duì dú mù duì qiáo
  - time: 04:13.15
    text: 琥珀对琼瑶。
    pinyin: hǔ pò duì qióng yáo
  - time: 04:15.63
    text: 兔毫对鸿爪，桂楫对兰桡。
    pinyin: tù háo duì hóng zhǎo guì jí duì lán ráo
  - time: 04:20.62
    text: 鱼潜藻，鹿藏蕉。
    pinyin: yú qián zǎo lù cáng jiāo
  - time: 04:23.99
    text: 水远对山遥。
    pinyin: shuǐ yuǎn duì shān yáo
  - time: 04:26.54
    text: 湘灵能鼓瑟，嬴女解吹箫。
    pinyin: xiāng líng néng gǔ sè yíng nǚ jiě chuī xiāo
  - time: 04:31.61
    text: 雪点寒梅横小院，风吹弱柳覆平桥。
    pinyin: xuě diǎn hán méi héng xiǎo yuàn fēng chuī ruò liǔ fù píng qiáo
  - time: 04:38.87
    text: 月牖通宵，绛蜡罢时光不减；
    pinyin: yuè yǒu tōng xiāo jiàng là bà shí guāng bù jiǎn
  - time: 04:44.17
    text: 风帘当昼，雕盘停后篆难消。
    pinyin: fēng lián dāng zhòu diāo pán tíng hòu zhuàn nán xiāo
  - time: 04:51.11
    text: 三 肴
    pinyin: sān yáo
  - time: 04:52.85
    text: 诗对礼，卦对爻。
    pinyin: shī duì lǐ guà duì yáo
  - time: 04:55.96
    text: 燕引对莺调。
    pinyin: yàn yǐn duì yīng tiáo
  - time: 04:58.84
    text: 晨钟对暮鼓，野饌对山肴。
    pinyin: chén zhōng duì mù gǔ yě zhuàn duì shān yáo
  - time: 05:03.96
    text: 雉方乳，鹊始巢。
    pinyin: zhì fāng rǔ què shǐ cháo
  - time: 05:07.27
    text: 猛虎对神獒。
    pinyin: měng hǔ duì shén áo
  - time: 05:09.73
    text: 疏星浮荇叶，皓月上松梢。
    pinyin: shū xīng fú xìng yè hào yuè shàng sōng shāo
  - time: 05:14.87
    text: 为邦自古推瑚琏，从政于今愧斗筲。
    pinyin: wéi bāng zì gǔ tuī hú liǎn cóng zhèng yú jīn kuì dǒu shāo
  - time: 05:21.72
    text: 管鲍相知，能交忘形胶漆友；
    pinyin: guǎn bào xiāng zhī néng jiāo wàng xíng jiāo qī yǒu
  - time: 05:27.78
    text: 蔺廉有隙，终为刎颈死生交。
    pinyin: lìn lián yǒu xì zhōng wéi wěn jǐng sǐ shēng jiāo
  - time: 05:33.41
    text: 歌对舞，笑对嘲。
    pinyin: gē duì wǔ xiào duì cháo
  - time: 05:36.53
    text: 耳语对神交。
    pinyin: ěr yǔ duì shén jiāo
  - time: 05:38.79
    text: 焉乌对亥豕，獭髓对鸾胶。
    pinyin: yān wū duì hài shǐ tǎ suǐ duì luán jiāo
  - time: 05:44.08
    text: 宜久敬，莫轻抛。
    pinyin: yí jiǔ jìng mò qīng pāo
  - time: 05:47.40
    text: 一气对同胞。
    pinyin: yí qì duì tóng bāo
  - time: 05:49.89
    text: 祭遵甘布被，张禄念绨袍。
    pinyin: zhài zūn gān bù bèi zhāng lù niàn tí páo
    annotation:
      1: 东汉初年的一位著名将领。
  - time: 05:54.98
    text: 花径风来逢客访，柴扉月到有僧敲。
    pinyin: huā jìng fēng lái féng kè fǎng chái fēi yuè dào yǒu sēng qiāo
  - time: 06:01.74
    text: 夜雨园中，一颗不雕王子柰；
    pinyin: yè yǔ yuán zhōng yì kē bù diāo wáng zǐ nài
  - time: 06:07.04
    text: 秋风江上，三重曾卷杜公茅。
    pinyin: qiū fēng jiāng shàng sān chóng céng juǎn dù gōng máo
  - time: 06:12.97
    text: 衙对舍，廪对庖。
    pinyin: yá duì shè lǐn duì páo
  - time: 06:16.51
    text: 玉磬对金铙。
    pinyin: yù qìng duì jīn náo
  - time: 06:18.88
    text: 竹林对梅岭，起凤对腾蛟。
    pinyin: zhú lín duì méi lǐng qǐ fèng duì téng jiāo
  - time: 06:23.78
    text: 鲛绡帐，兽锦袍。
    pinyin: jiāo xiāo zhàng shòu jǐn páo
  - time: 06:27.43
    text: 露果对风梢。
    pinyin: lù guǒ duì fēng shāo
  - time: 06:30.25
    text: 扬州输橘柚，荆土贡菁茅。
    pinyin: yáng zhōu shū jú yòu jīng tǔ gòng jīng máo
  - time: 06:35.68
    text: 断蛇埋地称孙叔，渡蚁作桥识宋郊。
    pinyin: duàn shé mái dì chēng sūn shū dù yǐ zuò qiáo shí sòng jiāo
  - time: 06:42.68
    text: 好梦难成，蛩响阶前偏唧唧；
    pinyin: hǎo mèng nán chéng qióng xiǎng jiē qián piān jī jī
  - time: 06:48.57
    text: 良朋远到，鸡声窗外正嘐嘐。
    pinyin: liáng péng yuǎn dào jī shēng chuāng wài zhèng jiāo jiāo
  - time: 06:54.72
    text: 四 豪
    pinyin: sì háo
  - time: 06:56.74
    text: 茭对茨，荻对蒿。
    pinyin: jiāo duì cí dí duì hāo
  - time: 07:00.12
    text: 山麓对江皋。
    pinyin: shān lù duì jiāng gāo
  - time: 07:02.86
    text: 莺簧对蝶板，麦浪对松涛。
    pinyin: yīng huáng duì dié bǎn mài làng duì sōng tāo
  - time: 07:07.78
    text: 骐骥足，凤凰毛。
    pinyin: qí jì zú fèng huáng máo
  - time: 07:10.93
    text: 美誉对嘉褒。
    pinyin: měi yù duì jiā bāo
  - time: 07:13.57
    text: 文人窥蠹简，学士书兔毫。
    pinyin: wén rén kuī dù jiǎn xué shì shū tù háo
  - time: 07:18.99
    text: 马援南征载薏苡，张骞西使进葡萄。
    pinyin: mǎ yuán nán zhēng zǎi yì yǐ zhāng qiān xī shǐ jìn pú táo
  - time: 07:25.37
    text: 辩口悬河，万语千言常亹亹；
    pinyin: biàn kǒu xuán hé wàn yǔ qiān yán cháng wéi wěi
  - time: 07:30.69
    text: 词源倒峡，连篇累牍自滔滔。
    pinyin: cí yuán dào xiá lián piān lěi dú zì tāo tāo
  - time: 07:36.14
    text: 梅对杏，李对桃。
    pinyin: méi duì xìng lǐ duì táo
  - time: 07:39.54
    text: 棫朴对旌旄。
    pinyin: yù pú duì jīng máo
  - time: 07:42.05
    text: 酒仙对诗史，德泽对恩膏。
    pinyin: jiǔ xiān duì shī shǐ dé zé duì ēn gāo
  - time: 07:46.87
    text: 悬一榻，梦三刀。
    pinyin: xuán yī tà mèng sān dāo
  - time: 07:50.28
    text: 拙逸对贵劳。
    pinyin: zhuō yì duì guì láo
  - time: 07:52.97
    text: 玉堂花烛绕，金殿月轮高。
    pinyin: yù táng huā zhú rào jīn diàn yuè lún gāo
  - time: 07:57.91
    text: 孤山看鹤盘云下，蜀道闻猿向月号。
    pinyin: gū shān kàn hè pán yún xià shǔ dào wén yuán xiàng yuè háo
  - time: 08:04.84
    text: 万事从人，有花有酒应自乐；
    pinyin: wàn shì cóng rén yǒu huā yǒu jiǔ yīng zì lè
  - time: 08:10.22
    text: 百年皆客，一丘一壑尽吾豪。
    pinyin: bǎi nián jiē kè yī qiū yí hè jìn wú háo
  - time: 08:15.94
    text: 台对省，署对曹。
    pinyin: tái duì shěng shǔ duì cáo
  - time: 08:19.42
    text: 分袂对同袍。
    pinyin: fēn mèi duì tóng páo
  - time: 08:21.73
    text: 鸣琴对击剑，返辙对回艚。
    pinyin: míng qín duì jī jiàn fǎn zhé duì huí cáo
  - time: 08:26.99
    text: 良借箸，操捉刀。
    pinyin: liáng jiè zhù cāo zhuō dāo
  - time: 08:30.51
    text: 香茶对醇醪。
    pinyin: xiāng chá duì chún láo
  - time: 08:33.16
    text: 滴泉归海大，篑土积山高。
    pinyin: dī quán guī hǎi dà kuì tǔ jī shān gāo
  - time: 08:38.21
    text: 石室客来煎雀舌，画堂宾至饮羊羔。
    pinyin: shí shì kè lái jiān què shé huà táng bīn zhì yǐn yáng gāo
  - time: 08:45.49
    text: 被谪贾生，湘水凄凉吟《鵩鸟》；
    pinyin: bèi zhé jiǎ shēng xiāng shuǐ qī liáng yín fú niǎo
  - time: 08:50.86
    text: 遭谗屈子，江潭憔悴著离骚。
    pinyin: zāo chán qū zǐ jiāng tán qiáo cuì zhù lí sāo
  - time: 08:57.58
    text: 五 歌
    pinyin: wǔ gē
  - time: 08:59.22
