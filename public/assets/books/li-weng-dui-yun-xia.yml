  - time: 27:55.17
    text: 淡泊对安恬。
    pinyin: dàn bó duì ān tián
  - time: 27:57.86
    text: 回头对极目，水底对山尖。
    pinyin: huí tóu duì jí mù shuǐ dǐ duì shān jiān
  - time: 28:02.82
    text: 腰袅袅，手纤纤。
    pinyin: yāo niǎo niǎo shǒu xiān xiān
  - time: 28:06.35
    text: 凤卜对鸾占。
    pinyin: fèng bǔ duì luán zhān
  - time: 28:08.91
    text: 开田多种粟，煮海尽成盐。
    pinyin: kāi tián duō zhòng sù zhǔ hǎi jìn chéng yán
  - time: 28:13.88
    text: 居同九世张公艺，恩给千人范仲淹。
    pinyin: jū tóng jiǔ shì zhāng gōng yì ēn gǐ qiān rén fàn zhòng yān
  - time: 28:20.74
    text: 箫弄凤来，秦女有缘能跨羽；
    pinyin: xiāo nòng fèng lái qín nǚ yǒu yuán néng kuà yǔ
  - time: 28:26.25
    text: 鼎成龙去，轩臣无计得攀髯。
    pinyin: dǐng chéng lóng qù xuān chén wú jì dé pān rán
  - time: 28:31.59
    text: 人对己，爱对嫌。
    pinyin: rén duì jǐ ài duì xián
  - time: 28:34.79
    text: 举止对观瞻。
    pinyin: jǔ zhǐ duì guān zhān
  - time: 28:37.77
    text: 四知对三语，义正对辞严。
    pinyin: sì zhī duì sān yǔ yì zhèng duì cí yán
  - time: 28:42.49
    text: 勤雪案，课风檐。
    pinyin: qín xuě àn kè fēng yán
  - time: 28:45.34
    text: 漏箭对书笺。
    pinyin: lòu jiàn duì shū jiān
  - time: 28:47.98
    text: 文繁归獭祭，体艳别香奁。
    pinyin: wén fán guī tǎ jì tǐ yàn bié xiāng lián
  - time: 28:53.43
    text: 昨夜题梅更一字，早春来燕卷重帘。
    pinyin: zuó yè tí méi gēng yí zì zǎo chūn lái yàn juǎn chóng lián
  - time: 29:00.10
    text: 诗以史名，愁里悲歌怀杜甫；
    pinyin: shī yǐ shǐ míng chóu lǐ bēi gē huái dù fǔ
  - time: 29:05.44
    text: 笔经人索，梦中显晦老江淹。
    pinyin: bǐ jīng rén suǒ mèng zhōng xiǎn huì lǎo jiāng yān
  - time: 29:11.86
    text: 十五 咸
    pinyin: shí wǔ xián
  - time: 29:14.10
    text: 栽对植，薙对芟。
    pinyin: zāi duì zhí tì duì shān
  - time: 29:17.69
    text: 二伯对三监。
    pinyin: èr bó duì sān jiān
  - time: 29:20.24
    text: 朝臣对国老，职事对官衔。
    pinyin: cháo chén duì guó lǎo zhí shì duì guān xián
  - time: 29:25.11
    text: 鹿麌麌，兔毚毚。
    pinyin: lù yǔ yǔ tù chán chán
  - time: 29:28.20
    text: 启牍对开缄。
    pinyin: qǐ dú duì kāi jiān
  - time: 29:30.73
    text: 绿杨莺睍睆，红杏燕呢喃。
    pinyin: lǜ yáng yīng xiàn huǎn hóng xìng yàn ní nán
  - time: 29:36.21
    text: 半篱白酒娱陶令，一枕黄粱度吕岩。
    pinyin: bàn lí bái jiǔ yú táo lìng yì zhěn huáng liáng dù lǚ yán
  - time: 29:43.11
    text: 九夏炎飙，长日风亭留客骑；
    pinyin: jiǔ xià yán biāo cháng rì fēng tíng liú kè jì
  - time: 29:48.76
    text: 三冬寒冽，漫天雪浪驻征帆。
    pinyin: sān dōng hán liè màn tiān xuě làng zhù zhēng fān
  - time: 29:54.43
    text: 梧对杞，柏对杉。
    pinyin: wú duì qǐ bǎi duì shān
  - time: 29:57.97
    text: 夏濩对韶咸。
    pinyin: xià hù duì sháo xián
  - time: 30:00.68
    text: 涧瀍对溱洧，巩洛对崤函。
    pinyin: jiàn chán duì zhēn wěi gǒng luò duì xiáo hán
  - time: 30:05.80
    text: 藏书洞，避诏岩。
    pinyin: cáng shū dòng bì zhào yán
  - time: 30:09.06
    text: 脱俗对超凡。
    pinyin: tuō sú duì chāo fán
  - time: 30:11.52
    text: 贤人羞献媚，正士嫉工谗。
    pinyin: xián rén xiū xiàn mèi zhèng shì jí gōng chán
  - time: 30:16.70
    text: 霸越谋臣推少伯，佐唐藩将重浑瑊。
    pinyin: bà yuè móu chén tuī shào bó zuǒ táng fān jiāng zhòng hún jiān
  - time: 30:23.68
    text: 邺下狂生，羯鼓三挝羞锦袄；
    pinyin: yè xià kuáng shēng jié gǔ sān zhuā xiū jǐn ǎo
  - time: 30:28.94
    text: 江州司马，琵琶一曲湿青衫。
    pinyin: jiāng zhōu sī mǎ pí pá yì qǔ shī qīng shān
  - time: 30:34.27
    text: 袍对笏，履对衫。
    pinyin: páo duì hù lǚ duì shān
  - time: 30:37.86
    text: 匹马对孤帆。
    pinyin: pǐ mǎ duì gū fān
  - time: 30:40.14
    text: 琢磨对雕镂，刻划对镌镵。
    pinyin: zhuó mó duì diāo lòu kè huà duì juān chán
  - time: 30:45.59
    text: 星北拱，日西衔。
    pinyin: xīng běi gǒng rì xī xián
  - time: 30:49.01
    text: 卮漏对鼎馋。
    pinyin: zhī lòu duì dǐng chán
  - time: 30:51.63
    text: 江边生桂若，海外树都咸。
    pinyin: jiāng biān shēng guì ruò hǎi wài shù dū xián
  - time: 30:57.11
    text: 但得恢恢存利刃，何须咄咄达空函。
    pinyin: dàn dé huī huī cún lì rèn hé xū duō duō dá kōng hán
  - time: 31:03.54
    text: 彩凤知音，乐典后夔须九奏；
    pinyin: cǎi fèng zhī yīn yuè diǎn hòu kuí xū jiǔ zòu
  - time: 31:09.09
    text: 金人守口，圣如尼父亦三缄。
    pinyin: jīn rén shǒu kǒu shèng rú ní fǔ yì sān jiān
