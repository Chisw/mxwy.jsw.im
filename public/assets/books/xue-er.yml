key: xue-er
sentences:
  - time: 00:00.39
    text: 论语
    pinyin: lún yǔ
  - time: 00:02.78
    text: 学而第一
    pinyin: xué ér dì yī
  - time: 00:05.62
    text: 子曰：
    pinyin: zǐ yuē
  - time: 00:07.35
    text: “学而时习之，不亦说乎？
    pinyin: xué ér shí xí zhī bú yì yuè hū
  - time: 00:12.49
    text: 有朋自远方来，不亦乐乎？
    pinyin: yǒu péng zì yuǎn fāng lái bù yì lè hū
  - time: 00:17.84
    text: 人不知而不愠，不亦君子乎？”
    pinyin: rén bù zhī ér bú yùn bú yì jūn zǐ hū
  - time: 00:23.91
    text: 有子曰：
    pinyin: yǒu zǐ yuē
  - time: 00:26.63
    text: “其为人也孝弟，
    pinyin: qí wéi rén yě xiào tì
  - time: 00:30.27
    text: 而好犯上者，
    pinyin: ér hào fàn shàng zhě
  - time: 00:32.33
    text: 鲜矣；
    pinyin: xiǎn yǐ
  - time: 00:33.77
    text: 不好犯上，
    pinyin: bú hào fàn shàng
  - time: 00:36.11
    text: 而好作乱者，
    pinyin: ér hào zuò luàn zhě
  - time: 00:38.31
    text: 未之有也。
    pinyin: wèi zhī yǒu yě
  - time: 00:40.63
    text: 君子务本，
    pinyin: jūn zǐ wù běn
  - time: 00:43.10
    text: 本立而道生。
    pinyin: běn lì ér dào shēng
  - time: 00:45.82
    text: 孝弟也者，
    pinyin: xiào tì yě zhě
  - time: 00:48.38
    text: 其为仁之本与！”
    pinyin: qí wéi rén zhī běn yú
  - time: 00:51.87
    text: 子曰：
    pinyin: zǐ yuē
  - time: 00:54.26
    text: “巧言令色，鲜矣仁！”
    pinyin: qiǎo yán lìng sè xiǎn yǐ rén
  - time: 00:58.99
    text: 曾子曰：
    pinyin: zēng zǐ yuē
  - time: 01:02.30
    text: “吾日三省吾身：
    pinyin: wú rì sān xǐng wú shēn
  - time: 01:05.78
    text: 为人谋而不忠乎？
    pinyin: wèi rén móu ér bù zhōng hū
  - time: 01:09.39
    text: 与朋友交而不信乎？
    pinyin: yǔ péng yǒu jiāo ér bú xìn hū
  - time: 01:13.70
    text: 传不习乎？”
    pinyin: chuán bù xí hū
  - time: 01:16.42
    text: 子曰：
    pinyin: zǐ yuē
  - time: 01:19.25
    text: “道千乘之国：
    pinyin: dào qiān shèng zhī guó
  - time: 01:22.12
    text: 敬事而信，
    pinyin: jìng shì ér xìn
  - time: 01:24.26
    text: 节用而爱人，
    pinyin: jié yòng ér ài rén
  - time: 01:26.89
    text: 使民以时。”
    pinyin: shǐ mín yǐ shí
  - time: 01:30.40
    text: 子曰：
    pinyin: zǐ yuē
  - time: 01:32.95
    text: “弟子入则孝，
    pinyin: dì zǐ rù zé xiào
  - time: 01:36.22
    text: 出则弟，
    pinyin: chū zé tì
  - time: 01:37.84
    text: 谨而信，
    pinyin: jǐn ér xìn
  - time: 01:39.70
    text: 泛爱众，
    pinyin: fàn ài zhòng
  - time: 01:41.64
    text: 而亲仁。
    pinyin: ér qīn rén
  - time: 01:43.13
    text: 行有馀力，
    pinyin: xíng yǒu yú lì
  - time: 01:45.52
    text: 则以学文。”
    pinyin: zé yǐ xué wén
  - time: 01:48.68
    text: 子夏曰：
    pinyin: zǐ xià yuē
  - time: 01:50.70
    text: “贤贤易色，
    pinyin: xián xián yì sè
  - time: 01:53.96
    text: 事父母能竭其力，
    pinyin: shì fù mǔ néng jié qí lì
  - time: 01:57.56
    text: 事君能致其身，
    pinyin: shì jūn néng zhì qí shēn
  - time: 02:00.80
    text: 与朋友交言而有信。
    pinyin: yǔ péng yǒu jiāo yán ér yǒu xìn
  - time: 02:05.16
    text: 虽曰未学，
    pinyin: suī yuē wèi xué
  - time: 02:07.87
    text: 吾必谓之学矣。”
    pinyin: wú bì wèi zhī xué yǐ
  - time: 02:11.47
    text: 子曰：
    pinyin: zǐ yuē
  - time: 02:13.89
    text: “君子不重则不威，
    pinyin: jūn zǐ bú zhòng zé bù wēi
  - time: 02:17.94
    text: 学则不固。
    pinyin: xué zé bú gù
  - time: 02:19.89
    text: 主忠信，
    pinyin: zhǔ zhōng xìn
  - time: 02:22.29
    text: 无友不如己者，
    pinyin: wú yǒu bù rú jǐ zhě
  - time: 02:25.07
    text: 过则勿惮改。”
    pinyin: guò zé wù dàn gǎi
  - time: 02:28.22
    text: 曾子曰：
    pinyin: zēng zǐ yuē
  - time: 02:31.11
    text: “慎终追远，
    pinyin: shèn zhōng zhuī yuǎn
  - time: 02:33.60
    text: 民德归厚矣。”
    pinyin: mín dé guī hòu yǐ
  - time: 02:37.08
    text: 子禽问于子贡曰：
    pinyin: zǐ qín wèn yú zǐ gòng yuē
  - time: 02:41.02
    text: “夫子至于是邦也，
    pinyin: fū zǐ zhì yú shì bāng yě
  - time: 02:44.64
    text: 必闻其政，
    pinyin: bì wén qí zhèng
  - time: 02:46.74
    text: 求之与？
    pinyin: qiú zhī yú
  - time: 02:48.67
    text: 抑与之与？”
    pinyin: yì yǔ zhī yú
  - time: 02:51.18
    text: 子贡曰：
    pinyin: zǐ gòng yuē
  - time: 02:53.87
    text: “夫子温、良、恭、俭、让以得之。
    pinyin: fū zǐ wēn liáng gōng jiǎn ràng yǐ dé zhī
  - time: 02:59.53
    text: 夫子之求之也，
    pinyin: fū zǐ zhī qiú zhī yě
  - time: 03:02.68
    text: 其诸异乎人之求之与？”
    pinyin: qí zhū yì hū rén zhī qiú zhī yú
  - time: 03:08.03
    text: 子曰：
    pinyin: zǐ yuē
  - time: 03:10.22
    text: “父在，观其志；
    pinyin: fù zài guān qí zhì
  - time: 03:13.19
    text: 父没，观其行；
    pinyin: fù mò guān qí xìng
  - time: 03:16.31
    text: 三年无改于父之道，
    pinyin: sān nián wú gǎi yú fù zhī dào
  - time: 03:19.80
    text: 可谓孝矣。”
    pinyin: kě wèi xiào yǐ
  - time: 03:23.17
    text: 有子曰：
    pinyin: yǒu zǐ yuē
  - time: 03:25.63
    text: “礼之用，和为贵。
    pinyin: lǐ zhī yòng hé wéi guì
  - time: 03:29.44
    text: 先王之道斯为美，
    pinyin: xiān wáng zhī dào sī wéi měi
  - time: 03:32.76
    text: 小大由之。
    pinyin: xiǎo dà yóu zhī
  - time: 03:35.07
    text: 有所不行，
    pinyin: yǒu suǒ bù xíng
  - time: 03:37.62
    text: 知和而和，
    pinyin: zhī hé ér hé
  - time: 03:39.70
    text: 不以礼节之，
    pinyin: bù yǐ lǐ jié zhī
  - time: 03:42.27
    text: 亦不可行也。”
    pinyin: yì bù kě xíng yě
  - time: 03:45.48
    text: 有子曰：
    pinyin: yǒu zǐ yuē
  - time: 03:48.04
    text: “信近于义，言可复也；
    pinyin: xìn jìn yú yì yán kě fù yě
  - time: 03:52.71
    text: 恭近于礼，远耻辱也；
    pinyin: gōng jìn yú lǐ yuǎn chǐ rǔ yě
  - time: 03:57.45
    text: 因不失其亲，亦可宗也。”
    pinyin: yīn bù shī qí qīn yì kě zōng yě
  - time: 04:03.08
    text: 子曰：
    pinyin: zǐ yuē
  - time: 04:04.98
    text: “君子食无求饱，
    pinyin: jūn zǐ shí wú qiú bǎo
  - time: 04:08.61
    text: 居无求安，
    pinyin: jū wú qiú ān
  - time: 04:10.24
    text: 敏于事而慎于言，
    pinyin: mǐn yú shì ér shèn yú yán
  - time: 04:14.16
    text: 就有道而正焉，
    pinyin: jiù yǒu dào ér zhèng yān
  - time: 04:17.19
    text: 可谓好学也已。”
    pinyin: kě wèi hào xué yě yǐ
  - time: 04:21.31
    text: 子贡曰：
    pinyin: zǐ gòng yuē
  - time: 04:23.78
    text: “贫而无谄，
    pinyin: pín ér wú chǎn
  - time: 04:26.47
    text: 富而无骄，
    pinyin: fù ér wú jiāo
  - time: 04:28.10
    text: 何如？”
    pinyin: hé rú
  - time: 04:29.85
    text: 子曰：
    pinyin: zǐ yuē
  - time: 04:31.61
    text: “可也。
    pinyin: kě yě
  - time: 04:33.44
    text: 未若贫而乐，
    pinyin: wèi ruò pín ér lè
  - time: 04:36.13
    text: 富而好礼者也。”
    pinyin: fù ér hào lǐ zhě yě
  - time: 04:39.13
    text: 子贡曰：
    pinyin: zǐ gòng yuē
  - time: 04:41.87
    text: “《诗》云：
    pinyin: shī yún
  - time: 04:43.91
    text: ‘如切如磋，如琢如磨。’
    pinyin: rú qiē rú cuō rú zhuó rú mó
  - time: 04:48.50
    text: 其斯之谓与？”
    pinyin: qí sī zhī wèi yú
  - time: 04:51.90
    text: 子曰：
    pinyin: zǐ yuē
  - time: 04:53.55
    text: “赐也，始可与言诗已矣！
    pinyin: cì yě shǐ kě yǔ yán shī yǐ yǐ
  - time: 04:58.24
    text: 告诸往而知来者。”
    pinyin: gào zhū wǎng ér zhī lái zhě
  - time: 05:02.82
    text: 子曰：
    pinyin: zǐ yuē
  - time: 05:04.96
    text: “不患人之不己知，
    pinyin: bú huàn rén zhī bù jǐ zhī
  - time: 05:08.77
    text: 患不知人也。”
    pinyin: huàn bù zhī rén yě
