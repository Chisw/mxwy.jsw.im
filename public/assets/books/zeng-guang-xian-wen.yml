sentences:
  - time: 00:00.51
    text: 增广贤文
    pinyin: zēng guǎng xián wén
  - time: 00:03.43
    text: 昔时贤文，诲汝谆谆。
    pinyin: xī shí xián wén huì rǔ zhūn zhūn
  - time: 00:08.24
    text: 集韵增广，多见多闻。
    pinyin: jí yùn zēng guǎng duō jiàn duō wén
  - time: 00:12.75
    text: 观今宜鉴古，无古不成今。
    pinyin: guān jīn yí jiàn gǔ wú gǔ bù chéng jīn
  - time: 00:18.30
    text: 知己知彼，将心比心。
    pinyin: zhī jǐ zhī bǐ jiāng xīn bǐ xīn
  - time: 00:22.80
    text: 酒逢知己饮，诗向会人吟。
    pinyin: jiǔ féng zhī jǐ yǐn shī xiàng huì rén yín
  - time: 00:28.10
    text: 相识满天下，知心能几人？
    pinyin: xiāng shí mǎn tiān xià zhī xīn néng jǐ rén
  - time: 00:34.01
    text: 相逢好似初相识，到老终无怨恨心。
    pinyin: xiāng féng hǎo sì chū xiāng shí dào lǎo zhōng wú yuàn hèn xīn
  - time: 00:41.21
    text: 近水知鱼性，近山识鸟音。
    pinyin: jìn shuǐ zhī yú xìng jìn shān shí niǎo yīn
  - time: 00:46.89
    text: 易涨易退山溪水，易反易覆小人心。
    pinyin: yì zhǎng yì tuì shān xī shuǐ yì fǎn yì fù xiǎo rén xīn
  - time: 00:53.61
    text: 运去金成铁，时来铁似金。
    pinyin: yùn qù jīn chéng tiě shí lái tiě sì jīn
  - time: 00:59.08
    text: 读书须用意，一字值千金。
    pinyin: dú shū xū yòng yì yí zì zhí qiān jīn
  - time: 01:04.29
    text: 逢人且说三分话，未可全抛一片心。
    pinyin: féng rén qiě shuō sān fēn huà wèi kě quán pāo yí piàn xīn
  - time: 01:11.06
    text: 有意栽花花不发，无心插柳柳成荫。
    pinyin: yǒu yì zāi huā huā bù fā wú xīn chā liǔ liǔ chéng yīn
  - time: 01:18.26
    text: 画虎画皮难画骨，知人知面不知心。
    pinyin: huà hǔ huà pí nán huà gǔ zhī rén zhī miàn bù zhī xīn
  - time: 01:24.83
    text: 钱财如粪土，仁义值千金。
    pinyin: qián cái rú fèn tǔ rén yì zhí qiān jīn
  - time: 01:30.21
    text: 流水下滩非有意，白云出岫本无心。
    pinyin: liú shuǐ xià tān fēi yǒu yì bái yún chū xiù běn wú xīn
  - time: 01:37.01
    text: 当时若不登高望，谁信东流海洋深？
    pinyin: dāng shí ruò bù dēng gāo wàng shuí xìn dōng liú hǎi yáng shēn
  - time: 01:43.50
    text: 路遥知马力，日久知人心。
    pinyin: lù yáo zhī mǎ lì rì jiǔ zhī rén xīn
  - time: 01:48.87
    text: 两人一般心，无钱堪买金；
    pinyin: liǎng rén yì bān xīn wú qián kān mǎi jīn
  - time: 01:53.96
    text: 一人一般心，有钱难买针。
    pinyin: yì rén yì bān xīn yǒu qián nán mǎi zhēn
  - time: 01:59.17
    text: 相见易得好，久住难为人。
    pinyin: xiāng jiàn yì dé hǎo jiǔ zhù nán wéi rén
  - time: 02:04.79
    text: 马行无力皆因瘦，人不风流只为贫。
    pinyin: mǎ xíng wú lì jiē yīn shòu rén bù fēng liú zhǐ wèi pín
  - time: 02:12.08
    text: 饶人不是痴汉，痴汉不会饶人。
    pinyin: ráo rén bú shì chī hàn chī hàn bú huì ráo rén
  - time: 02:18.15
    text: 是亲不是亲，非亲却是亲。
    pinyin: shì qīn bú shì qīn fēi qīn què shì qīn
  - time: 02:23.41
    text: 美不美，乡中水；
    pinyin: měi bù měi xiāng zhōng shuǐ
  - time: 02:26.41
    text: 亲不亲，故乡人。
    pinyin: qīn bù qīn gù xiāng rén
  - time: 02:29.50
    text: 莺花犹怕春光老，岂可教人枉度春？
    pinyin: yīng huā yóu pà chūn guāng lǎo qǐ kě jiào rén wǎng dù chūn
  - time: 02:36.18
    text: 相逢不饮空归去，洞口桃花也笑人。
    pinyin: xiāng féng bù yǐn kōng guī qù dòng kǒu táo huā yě xiào rén
  - time: 02:43.45
    text: 红粉佳人休使老，风流浪子莫教贫。
    pinyin: hóng fěn jiā rén xiū shǐ lǎo fēng liú làng zǐ mò jiāo pín
  - time: 02:50.51
    text: 在家不会迎宾客，出外方知少主人。
    pinyin: zài jiā bù huì yíng bīn kè chū wài fāng zhī shǎo zhǔ rén
  - time: 02:57.59
    text: 黄芩无假，阿魏无真。
    pinyin: huáng jīn wú jiǎ ā wèi wú zhēn
  - time: 03:02.14
    text: 客来主不顾，应恐是痴人。
    pinyin: kè lái zhǔ bù gù yīng kǒng shì chī rén
  - time: 03:07.63
    text: 贫居闹市无人问，富在深山有远亲。
    pinyin: pín jū nào shì wú rén wèn fù zài shēn shān yǒu yuǎn qīn
  - time: 03:14.76
    text: 谁人背后无人说，哪个人前不说人？
    pinyin: shuí rén bèi hòu wú rén shuō nǎ gè rén qián bù shuō rén
  - time: 03:21.53
    text: 有钱道真语，无钱语不真。
    pinyin: yǒu qián dào zhēn yǔ wú qián yǔ bù zhēn
  - time: 03:26.77
    text: 不信但看筵中酒，杯杯先劝有钱人。
    pinyin: bù xìn dàn kàn yán zhōng jiǔ bēi bēi xiān quàn yǒu qián rén
  - time: 03:34.08
    text: 闹里有钱，静处安身。
    pinyin: nào lǐ yǒu qián jìng chù ān shēn
  - time: 03:38.49
    text: 来如风雨，去似微尘。
    pinyin: lái rú fēng yǔ qù sì wēi chén
  - time: 03:42.41
    text: 长江后浪推前浪，世上新人赶旧人。
    pinyin: cháng jiāng hòu làng tuī qián làng shì shàng xīn rén gǎn jiù rén
  - time: 03:49.26
    text: 近水楼台先得月，向阳花木早逢春。
    pinyin: jìn shuǐ lóu tái xiān dé yuè xiàng yáng huā mù zǎo féng chūn
  - time: 03:55.82
    text: 莫道君行早，更有早行人。
    pinyin: mò dào jūn xíng zǎo gèng yǒu zǎo xíng rén
  - time: 04:00.96
    text: 莫信直中直，须防仁不仁。
    pinyin: mò xìn zhí zhōng zhí xū fáng rén bù rén
  - time: 04:06.28
    text: 山中有直树，世上无直人。
    pinyin: shān zhōng yǒu zhí shù shì shàng wú zhí rén
  - time: 04:11.82
    text: 自恨枝无叶，莫怨太阳偏。
    pinyin: zì hèn zhī wú yè mò yuàn tài yáng piān
  - time: 04:17.07
    text: 大家都是命，半点不由人。
    pinyin: dà jiā dōu shì mìng bàn diǎn bù yóu rén
  - time: 04:22.58
    text: 一年之计在于春，一日之计在于寅。
    pinyin: yì nián zhī jì zài yú chūn yí rì zhī jì zài yú yín
  - time: 04:29.14
    text: 一家之计在于和，一生之计在于勤。
    pinyin: yì jiā zhī jì zài yú hé yì shēng zhī jì zài yú qín
  - time: 04:35.79
    text: 责人之心责己，恕己之心恕人。
    pinyin: zé rén zhī xīn zé jǐ shù jǐ zhī xīn shù rén
  - time: 04:41.75
    text: 守口如瓶，防意如城。
    pinyin: shǒu kǒu rú píng fáng yì rú chéng
  - time: 04:46.35
    text: 宁可人负我，切莫我负人。
    pinyin: nìng kě rén fù wǒ qiè mò wǒ fù rén
  - time: 04:51.40
    text: 再三须慎意，第一莫欺心。
    pinyin: zài sān xū shèn yì dì yī mò qī xīn
  - time: 04:56.71
    text: 虎身犹可近，人毒不堪亲。
    pinyin: hǔ shēn yóu kě jìn rén dú bù kān qīn
  - time: 05:02.18
    text: 来说是非者，便是是非人。
    pinyin: lái shuō shì fēi zhě biàn shì shì fēi rén
  - time: 05:07.25
    text: 远水难救近火，远亲不如近邻。
    pinyin: yuǎn shuǐ nán jiù jìn huǒ yuǎn qīn bù rú jìn lín
  - time: 05:13.35
    text: 有茶有酒多兄弟，急难何曾见一人？
    pinyin: yǒu chá yǒu jiǔ duō xiōng dì jí nàn hé céng jiàn yì rén
  - time: 05:19.86
    text: 人情似纸张张薄，世事如棋局局新。
    pinyin: rén qíng sì zhǐ zhāng zhāng bó shì shì rú qí jú jú xīn
  - time: 05:26.55
    text: 山中也有千年树，世上难逢百岁人。
    pinyin: shān zhōng yě yǒu qiān nián shù shì shàng nán féng bǎi suì rén
  - time: 05:33.48
    text: 力微休负重，言轻莫劝人。
    pinyin: lì wēi xiū fù zhòng yán qīng mò quàn rén
  - time: 05:38.81
    text: 无钱休入众，遭难莫寻亲。
    pinyin: wú qián xiū rù zhòng zāo nàn mò xún qīn
  - time: 05:43.88
    text: 平生莫做皱眉事，世上应无切齿人。
    pinyin: píng shēng mò zuò zhòu méi shì shì shàng yīng wú qiè chǐ rén
  - time: 05:50.60
    text: 士者国之宝，儒为席上珍。
    pinyin: shì zhě guó zhī bǎo rú wéi xí shàng zhēn
  - time: 05:55.90
    text: 若要断酒法，醒眼看醉人。
    pinyin: ruò yào duàn jiǔ fǎ xǐng yǎn kàn zuì rén
  - time: 06:01.57
    text: 求人须求大丈夫，济人须济急时无。
    pinyin: qiú rén xū qiú dà zhàng fū jì rén xū jì jí shí wú
  - time: 06:08.31
    text: 渴时一滴如甘露，醉后添杯不如无。
    pinyin: kě shí yì dī rú gān lù zuì hòu tiān bēi bù rú wú
  - time: 06:14.78
    text: 久住令人嫌，频来亲也疏。
    pinyin: jiǔ zhù lìng rén xián pín lái qīn yě shū
  - time: 06:20.25
    text: 酒中不语真君子，财上分明大丈夫。
    pinyin: jiǔ zhōng bù yǔ zhēn jūn zǐ cái shàng fēn míng dà zhàng fū
  - time: 06:26.73
    text: 出家如初，成佛有余。
    pinyin: chū jiā rú chū chéng fó yǒu yú
  - time: 06:31.61
    text: 积金千两，不如明解经书。
    pinyin: jī jīn qiān liǎng bù rú míng jiě jīng shū
  - time: 06:36.33
    text: 养子不教如养驴，养女不教如养猪。
    pinyin: yǎng zǐ bú jiào rú yǎng lǘ yǎng nǚ bú jiào rú yǎng zhū
  - time: 06:42.88
    text: 有田不耕仓廪虚，有书不读子孙愚。
    pinyin: yǒu tián bù gēng cāng lǐn xū yǒu shū bù dú zǐ sūn yú
  - time: 06:49.54
    text: 仓廪虚兮岁月乏，子孙愚兮礼义疏。
    pinyin: cāng lǐn xū xī suì yuè fá zǐ sūn yú xī lǐ yì shū
  - time: 06:56.32
    text: 同君一席话，胜读十年书。
    pinyin: tóng jūn yì xí huà shèng dú shí nián shū
  - time: 07:00.86
    text: 人不通今古，马牛如襟裾。
    pinyin: rén bù tōng jīn gǔ mǎ niú rú jīn jū
  - time: 07:06.51
    text: 茫茫四海人无数，哪个男儿是丈夫？
    pinyin: máng máng sì hǎi rén wú shù nǎ gè nán ér shì zhàng fū
  - time: 07:13.03
    text: 白酒酿成缘好客，黄金散尽为收书。
    pinyin: bái jiǔ niàng chéng yuán hào kè huáng jīn sàn jìn wèi shōu shū
  - time: 07:20.37
    text: 救人一命，胜造七级浮屠。
    pinyin: jiù rén yí mìng shèng zào qī jí fú tú
  - time: 07:25.02
    text: 城门失火，殃及池鱼。
    pinyin: chéng mén shī huǒ yāng jí chí yú
  - time: 07:29.02
    text: 庭前生瑞草，好事不如无。
    pinyin: tíng qián shēng ruì cǎo hǎo shì bù rú wú
  - time: 07:34.54
    text: 欲求生富贵，须下死工夫。
    pinyin: yù qiú shēng fù guì xū xià sǐ gōng fū
  - time: 07:39.38
    text: 百年成之不足，一旦败之有余。
    pinyin: bǎi nián chéng zhī bù zú yí dàn bài zhī yǒu yú
  - time: 07:44.80
    text: 人心似铁，官法如炉。
    pinyin: rén xīn sì tiě guān fǎ rú lú
  - time: 07:49.09
    text: 善化不足，恶化有余。
    pinyin: shàn huà bù zú è huà yǒu yú
  - time: 07:52.87
    text: 水至清则无鱼，人至察则无徒。
    pinyin: shuǐ zhì qīng zé wú yú rén zhì chá zé wú tú
  - time: 07:58.48
    text: 知者减半，省者全无。
    pinyin: zhì zhě jiǎn bàn xǐng zhě quán wú
  - time: 08:02.67
    text: 在家由父，出嫁从夫。
    pinyin: zài jiā yóu fù chū jià cóng fū
  - time: 08:06.82
    text: 痴人畏妇，贤女敬夫。
    pinyin: chī rén wèi fù xián nǚ jìng fū
  - time: 08:11.63
    text: 是非终日有，不听自然无。
    pinyin: shì fēi zhōng rì yǒu bù tīng zì rán wú
  - time: 08:17.05
    text: 宁可正而不足，不可邪而有余。
    pinyin: nìng kě zhèng ér bù zú bù kě xié ér yǒu yú
  - time: 08:22.60
    text: 宁可信其有，不可信其无。
    pinyin: nìng kě xìn qí yǒu bù kě xìn qí wú
  - time: 08:27.67
    text: 竹篱茅舍风光好，道院僧堂终不如。
    pinyin: zhú lí máo shè fēng guāng hǎo dào yuàn sēng táng zhōng bù rú
  - time: 08:35.03
    text: 命里有时终须有，命里无时莫强求。
    pinyin: mìng lǐ yǒu shí zhōng xū yǒu mìng lǐ wú shí mò qiǎng qiú
  - time: 08:41.60
    text: 道院迎仙客，书堂隐相儒。
    pinyin: dào yuàn yíng xiān kè shū táng yǐn xiàng rú
  - time: 08:47.60
    text: 庭栽栖凤竹，池养化龙鱼。
    pinyin: tíng zāi qī fèng zhú chí yǎng huà lóng yú
  - time: 08:52.72
    text: 结交须胜己，似我不如无。
    pinyin: jié jiāo xū shèng jǐ sì wǒ bù rú wú
  - time: 08:57.82
    text: 但看三五日，相见不如初。
    pinyin: dàn kàn sān wǔ rì xiāng jiàn bù rú chū
  - time: 09:03.47
    text: 人情似水分高下，世事如云任卷舒。
    pinyin: rén qíng sì shuǐ fēn gāo xià shì shì rú yún rèn juàn shū
  - time: 09:10.28
    text: 会说说都是，不会说无理。
    pinyin: huì shuō shuō dōu shì bù huì shuō wú lǐ
  - time: 09:15.63
    text: 磨刀恨不利，刀利伤人指；
    pinyin: mó dāo hèn bú lì dāo lì shāng rén zhǐ
  - time: 09:21.27
    text: 求财恨不得，财多害自己。
    pinyin: qiú cái hèn bù dé cái duō hài zì jǐ
  - time: 09:26.12
    text: 知足常足，终身不辱；
    pinyin: zhī zú cháng zú zhōng shēn bù rǔ
  - time: 09:30.43
    text: 知止常止，终身不耻。
    pinyin: zhī zhǐ cháng zhǐ zhōng shēn bù chǐ
  - time: 09:34.63
    text: 有福伤财，无福伤己。
    pinyin: yǒu fú shāng cái wú fú shāng jǐ
  - time: 09:38.53
    text: 差之毫厘，失之千里。
    pinyin: chā zhī háo lí shī zhī qiān lǐ
  - time: 09:43.06
    text: 若登高必自卑，若涉远必自迩。
    pinyin: ruò dēng gāo bì zì bēi ruò shè yuǎn bì zì ěr
  - time: 09:48.95
    text: 三思而行，再思可矣。
    pinyin: sān sī ér xíng zài sī kě yǐ
  - time: 09:53.02
    text: 使口不如自走，求人不如求己。
    pinyin: shǐ kǒu bù rú zì zǒu qiú rén bù rú qiú jǐ
  - time: 09:58.67
    text: 小时是兄弟，长大各乡里。
    pinyin: xiǎo shí shì xiōng dì zhǎng dà gè xiāng lǐ
  - time: 10:04.31
    text: 妒财莫妒食，怨生莫怨死。
    pinyin: dù cái mò dù shí yuàn shēng mò yuàn sǐ
  - time: 10:09.87
    text: 人见白头嗔，我见白头喜。
    pinyin: rén jiàn bái tóu chēn wǒ jiàn bái tóu xǐ
  - time: 10:15.28
    text: 多少少年亡，不到白头死。
    pinyin: duō shǎo shào nián wáng bú dào bái tóu sǐ
  - time: 10:20.34
    text: 墙有缝，壁有耳。
    pinyin: qiáng yǒu fèng bì yǒu ěr
