  - time: 31:04.60
    text: 公道世间唯白发，贵人头上不曾饶。
    pinyin: gōng dào shì jiān wéi bái fà guì rén tóu shàng bù céng ráo
  - time: 31:11.59
    text: 有钱堪出众，无衣懒出门。
    pinyin: yǒu qián kān chū zhòng wú yī lǎn chū mén
  - time: 31:17.30
    text: 为官须作相，及第必争先。
    pinyin: wéi guān xū zuò xiàng jí dì bì zhēng xiān
  - time: 31:22.16
    text: 闲时不烧香，急时抱佛脚。
    pinyin: xián shí bù shāo xiāng jí shí bào fó jiǎo
  - time: 31:27.60
    text: 幸生太平无事日，恐逢年老不多时。
    pinyin: xìng shēng tài píng wú shì rì kǒng féng nián lǎo bù duō shí
  - time: 31:34.11
    text: 国乱思良将，家贫思贤妻。
    pinyin: guó luàn sī liáng jiàng jiā pín sī xián qī
  - time: 31:39.80
    text: 池塘积水须防旱，田地勤耕足养家。
    pinyin: chí táng jī shuǐ xū fáng hàn tián dì qín gēng zú yǎng jiā
  - time: 31:46.34
    text: 根深不怕风摇动，树正何愁月影斜。
    pinyin: gēn shēn bú pà fēng yáo dòng shù zhèng hé chóu yuè yǐng xié
  - time: 31:53.35
    text: 奉劝君子，各宜守己。
    pinyin: fèng quàn jūn zǐ gè yí shǒu jǐ
  - time: 31:58.05
    text: 只此呈示，万无一失。
    pinyin: zhǐ cǐ chéng shì wàn wú yī shī
