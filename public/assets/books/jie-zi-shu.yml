key: jie-zi-shu
sentences:
  - time: 00:00.60
    text: 诫子书 诸葛亮
    pinyin: jiè zǐ shū zhū gě liàng
  - time: 00:04.37
    text: 夫君子之行，
    pinyin: fú jūn zǐ zhī xíng
  - time: 00:06.81
    text: 静以修身，
    pinyin: jìng yǐ xiū shēn
  - time: 00:08.55
    text: 俭以养德。
    pinyin: jiǎn yǐ yǎng dé
  - time: 00:10.66
    text: 非淡泊无以明志，
    pinyin: fēi dàn bó wú yǐ míng zhì
  - time: 00:13.56
    text: 非宁静无以致远。
    pinyin: fēi níng jìng wú yǐ zhì yuǎn
  - time: 00:17.36
    text: 夫学须静也，
    pinyin: fú xué xū jìng yě
  - time: 00:19.99
    text: 才须学也，
    pinyin: cái xū xué yě
  - time: 00:22.06
    text: 非学无以广才，
    pinyin: fēi xué wú yǐ guǎng cái
  - time: 00:24.89
    text: 非志无以成学。
    pinyin: fēi zhì wú yǐ chéng xué
  - time: 00:28.21
    text: 淫慢则不能励精，
    pinyin: yín màn zé bù néng lì jīng
  - time: 00:31.24
    text: 险躁则不能治性。
    pinyin: xiǎn zào zé bù néng zhì xìng
  - time: 00:34.61
    text: 年与时驰，
    pinyin: nián yǔ shí chí
  - time: 00:36.49
    text: 意与日去，
    pinyin: yì yǔ rì qù
  - time: 00:38.45
    text: 遂成枯落，
    pinyin: suì chéng kū luò
  - time: 00:40.44
    text: 多不接世，
    pinyin: duō bù jiē shì
  - time: 00:42.41
    text: 悲守穷庐，
    pinyin: bēi shǒu qióng lú
  - time: 00:44.54
    text: 将复何及！
    pinyin: jiāng fù hé jí
