sentences:
  - time: 00:00.80
    text: 笠翁对韵
    pinyin: lì wēng duì yùn
  - time: 00:02.87
    text: 作者 清 李渔
    pinyin: zuò zhě qīng lǐ yú
  - time: 00:06.66
    text: 白云出岫朗读
    pinyin: bái yún chū xiù lǎng dú
  - time: 00:09.65
    text: 一 东
    pinyin: yī dōng
  - time: 00:12.00
    text: 天对地，雨对风。
    pinyin: tiān duì dì yǔ duì fēng
  - time: 00:16.23
    text: 大陆对长空。
    pinyin: dà lù duì cháng kōng
  - time: 00:18.87
    text: 山花对海树，赤日对苍穹。
    pinyin: shān huā duì hǎi shù chì rì duì cāng qióng
  - time: 00:24.52
    text: 雷隐隐，雾蒙蒙。
    pinyin: léi yǐn yǐn wù méng méng
  - time: 00:27.57
    text: 日下对天中。
    pinyin: rì xià duì tiān zhōng
  - time: 00:30.11
    text: 风高秋月白，雨霁晚霞红。
    pinyin: fēng gāo qiū yuè bái yǔ jì wǎn xiá hóng
  - time: 00:35.91
    text: 牛女二星河左右，参商两曜斗西东。
    pinyin: niú nǚ èr xīng hé zuǒ yòu shēn shāng liǎng yào dǒu xī dōng
  - time: 00:42.53
    text: 十月塞边，飒飒寒霜惊戍旅；
    pinyin: shí yuè sài biān sà sà hán shuāng jīng shù lǚ
  - time: 00:48.22
    text: 三冬江上，漫漫朔雪冷渔翁。
    pinyin: sān dōng jiāng shàng màn màn shuò xuě lěng yú wēng
  - time: 00:54.30
    text: 河对汉，绿对红。
    pinyin: hé duì hàn lǜ duì hóng
  - time: 00:57.84
    text: 雨伯对雷公。
    pinyin: yǔ bó duì léi gōng
  - time: 01:00.33
    text: 烟楼对雪洞，月殿对天宫。
    pinyin: yān lóu duì xuě dòng yuè diàn duì tiān gōng
  - time: 01:05.79
    text: 云叆叇，日曈曚。
    pinyin: yún ài dài rì tóng méng
  - time: 01:09.37
    text: 蜡屐对渔篷。
    pinyin: là jī duì yú péng
  - time: 01:12.06
    text: 过天星似箭，吐魄月如弓。
    pinyin: guò tiān xīng sì jiàn tǔ pò yuè rú gōng
  - time: 01:17.33
    text: 驿旅客逢梅子雨，池亭人挹藕花风。
    pinyin: yì lǚ kè féng méi zǐ yǔ chí tíng rén yì ǒu huā fēng
  - time: 01:24.29
    text: 茅店村前，皓月坠林鸡唱韵；
    pinyin: máo diàn cūn qián hào yuè zhuì lín jī chàng yùn
  - time: 01:29.55
    text: 板桥路上，青霜锁道马行踪。
    pinyin: bǎn qiáo lù shàng qīng shuāng suǒ dào mǎ xíng zōng
  - time: 01:35.70
    text: 山对海，华对嵩。
    pinyin: shān duì hǎi huà duì sōng
  - time: 01:39.69
    text: 四岳对三公。
    pinyin: sì yuè duì sān gōng
  - time: 01:42.49
    text: 宫花对禁柳，塞雁对江龙。
    pinyin: gōng huā duì jìn liǔ sài yàn duì jiāng lóng
  - time: 01:47.98
    text: 清暑殿，广寒宫。
    pinyin: qīng shǔ diàn guǎng hán gōng
  - time: 01:51.48
    text: 拾翠对题红。
    pinyin: shí cuì duì tí hóng
  - time: 01:53.99
    text: 庄周梦化蝶，吕望兆飞熊。
    pinyin: zhuāng zhōu mèng huà dié lǚ wàng zhào fēi xióng
  - time: 01:59.65
    text: 北牖当风停夏扇，南帘曝日省冬烘。
    pinyin: běi yǒu dāng fēng tíng xià shàn nán lián pù rì shěng dōng hōng
  - time: 02:06.67
    text: 鹤舞楼头，玉笛弄残仙子月；
    pinyin: hè wǔ lóu tóu yù dí nòng cán xiān zǐ yuè
  - time: 02:12.85
    text: 凤翔台上，紫箫吹断美人风。
    pinyin: fèng xiáng tái shàng zǐ xiāo chuī duàn měi rén fēng
  - time: 02:19.57
    text: 二 冬
    pinyin: èr dōng
  - time: 02:21.65
    text: 晨对午，夏对冬。
    pinyin: chén duì wǔ xià duì dōng
  - time: 02:25.03
    text: 下饷对高舂。
    pinyin: xià xiǎng duì gāo chōng
  - time: 02:27.66
    text: 青春对白昼，古柏对苍松。
    pinyin: qīng chūn duì bái zhòu gǔ bǎi duì cāng sōng
  - time: 02:33.11
    text: 垂钓客，荷锄翁。
    pinyin: chuí diào kè hè chú wēng
  - time: 02:36.44
    text: 仙鹤对神龙。
    pinyin: xiān hè duì shén lóng
  - time: 02:39.22
    text: 凤冠珠闪烁，螭带玉玲珑。
    pinyin: fèng guān zhū shǎn shuò chī dài yù líng lóng
  - time: 02:44.45
    text: 三元及第才千顷，一品当朝禄万钟。
    pinyin: sān yuán jí dì cái qiān qǐng yì pǐn dāng cháo lù wàn zhōng
  - time: 02:51.70
    text: 花萼楼间，仙李盘根调国脉；
    pinyin: huā è lóu jiān xiān lǐ pán gēn tiáo guó mò
  - time: 02:57.18
    text: 沉香亭畔，娇杨擅宠起边风。
    pinyin: chén xiāng tíng pàn jiāo yáng shàn chǒng qǐ biān fēng
  - time: 03:02.90
    text: 清对淡，薄对浓。
    pinyin: qīng duì dàn bó duì nóng
  - time: 03:06.62
    text: 暮鼓对晨钟。
    pinyin: mù gǔ duì chén zhōng
  - time: 03:09.10
    text: 山茶对石菊，烟锁对云封。
    pinyin: shān chá duì shí jú yān suǒ duì yún fēng
  - time: 03:14.47
    text: 金菡萏，玉芙蓉。
    pinyin: jīn hàn dàn yù fú róng
  - time: 03:17.89
    text: 绿绮对青锋。
    pinyin: lǜ qǐ duì qīng fēng
  - time: 03:20.54
    text: 早汤先宿酒，晚食继朝饔。
    pinyin: zǎo tāng xiān sù jiǔ wǎn shí jì zhāo yōng
  - time: 03:26.19
    text: 唐库金钱能化蝶，延津宝剑会成龙。
    pinyin: táng kù jīn qián néng huà dié yán jīn bǎo jiàn huì chéng lóng
  - time: 03:33.27
    text: 巫峡浪传，云雨荒唐神女庙；
    pinyin: wū xiá làng chuán yún yǔ huāng táng shén nǚ miào
  - time: 03:39.06
    text: 岱宗遥望，儿孙罗列丈人峰。
    pinyin: dài zōng yáo wàng ér sūn luó liè zhàng rén fēng
  - time: 03:44.86
    text: 繁对简，叠对重。
    pinyin: fán duì jiǎn dié duì chóng
  - time: 03:48.48
    text: 意懒对心慵。
    pinyin: yì lǎn duì xīn yōng
  - time: 03:51.26
    text: 仙翁对释伴，道范对儒宗。
    pinyin: xiān wēng duì shì bàn dào fàn duì rú zōng
  - time: 03:56.88
    text: 花灼灼，草茸茸。
    pinyin: huā zhuó zhuó cǎo róng róng
  - time: 04:00.04
    text: 浪蝶对狂蜂。
    pinyin: làng dié duì kuáng fēng
  - time: 04:02.62
    text: 数竿君子竹，五树大夫松。
    pinyin: shù gān jūn zǐ zhú wǔ shù dà fū sōng
  - time: 04:07.70
    text: 高皇灭项凭三杰，虞帝承尧殛四凶。
    pinyin: gāo huáng miè xiàng píng sān jié yú dì chéng yáo jí sì xiōng
  - time: 04:15.19
    text: 内苑佳人，满地风光愁不尽；
    pinyin: nèi yuàn jiā rén mǎn dì fēng guāng chóu bú jìn
  - time: 04:20.68
    text: 边关过客，连天烟草憾无穷。
    pinyin: biān guān guò kè lián tiān yān cǎo hàn wú qióng
  - time: 04:26.85
    text: 三 江
    pinyin: sān jiāng
  - time: 04:29.61
    text: 奇对偶，只对双。
    pinyin: jī duì ǒu zhī duì shuāng
  - time: 04:33.04
    text: 大海对长江。
    pinyin: dà hǎi duì cháng jiāng
  - time: 04:35.52
    text: 金盘对玉盏，宝烛对银釭。
    pinyin: jīn pán duì yù zhǎn bǎo zhú duì yín gāng
  - time: 04:40.96
    text: 朱漆槛，碧纱窗。
    pinyin: zhū qī jiàn bì shā chuāng
  - time: 04:44.40
    text: 舞调对歌腔。
    pinyin: wǔ diào duì gē qiāng
  - time: 04:47.04
    text: 兴汉推马武，谏夏著龙逄。
    pinyin: xìng hàn tuī mǎ wǔ jiàn xià zhù lóng páng
  - time: 04:52.32
    text: 四收列国群王服，三筑高城众敌降。
    pinyin: sì shōu liè guó qún wáng fú sān zhù gāo chéng zhòng dí xiáng
  - time: 04:59.08
    text: 跨凤登台，潇洒仙姬秦弄玉；
    pinyin: kuà fèng dēng tái xiāo sǎ xiān jī qín nòng yù
  - time: 05:04.65
    text: 斩蛇当道，英雄天子汉刘邦。
    pinyin: zhǎn shé dāng dào yīng xióng tiān zǐ hàn liú bāng
  - time: 05:10.46
    text: 颜对貌，像对庞。
    pinyin: yán duì mào xiàng duì páng
  - time: 05:14.56
    text: 步辇对徒杠。
    pinyin: bù niǎn duì tú gāng
  - time: 05:17.07
    text: 停针对搁筑，意懒对心降。
    pinyin: tíng zhēn duì gē zhù yì lǎn duì xīn xiáng
  - time: 05:22.30
    text: 灯闪闪，月幢幢。
    pinyin: dēng shán shǎn yuè chuáng chuáng
  - time: 05:25.53
    text: 揽辔对飞艎。
    pinyin: lǎn pèi duì fēi xiāng
    annotation:
      5: 艎，读音存疑。
  - time: 05:28.36
    text: 柳堤驰骏马，花院吠村尨。
    pinyin: liǔ dī chí jùn mǎ huā yuàn fèi cūn máng
  - time: 05:33.03
    text: 酒量微酡琼杏颊，香尘没印玉莲双。
    pinyin: jiǔ liàng wēi tuó qióng xìng jiá xiāng chén mò yìn yù lián shuāng
  - time: 05:40.53
    text: 诗写丹枫，韩女幽怀流御水；
    pinyin: shī xiě dān fēng hán nǚ yōu huái liú yù shuǐ
  - time: 05:46.12
    text: 泪弹斑竹，舜妃遗憾积湡江。
    pinyin: lèi tán bān zhú shùn fēi yí hàn jī yú jiāng
  - time: 05:52.04
    text: 四 支
    pinyin: sì zhī
  - time: 05:54.58
    text: 泉对石，干对枝。
    pinyin: quán duì shí gàn duì zhī
  - time: 05:57.89
    text: 吹竹对弹丝。
    pinyin: chuī zhú duì tán sī
  - time: 06:00.34
    text: 山亭对水榭，鹦鹉对鸬鹚。
    pinyin: shān tíng duì shuǐ xiè yīng wǔ duì lú cí
  - time: 06:05.78
    text: 五色笔，十香词。
    pinyin: wǔ sè bǐ shí xiāng cí
  - time: 06:09.04
    text: 泼墨对传卮。
    pinyin: pō mò duì chuán zhī
  - time: 06:11.70
    text: 神奇韩干画，雄浑李陵诗。
    pinyin: shén qí hán gàn huà xióng hún lǐ líng shī
  - time: 06:16.92
    text: 几处花街新夺锦，有人香径淡凝脂。
    pinyin: jǐ chù huā jiē xīn duó jǐn yǒu rén xiāng jìng dàn níng zhī
  - time: 06:24.04
    text: 万里烽烟，战士边关争保塞；
    pinyin: wàn lǐ fēng yān zhàn shì biān guān zhēng bǎo sài
  - time: 06:29.22
    text: 一犁膏雨，农夫村外尽乘时。
    pinyin: yì lí gāo yǔ nóng fū cūn wài jìn chéng shí
  - time: 06:34.78
    text: 菹对醢，赋对诗。
    pinyin: zū duì hǎi fù duì shī
  - time: 06:38.41
    text: 点漆对描脂。
    pinyin: diǎn qī duì miáo zhī
  - time: 06:40.88
    text: 璠簪对珠履，剑客对琴师。
    pinyin: fán zān duì zhū lǚ jiàn kè duì qín shī
  - time: 06:46.10
    text: 沽酒价，买山资。
    pinyin: gū jiǔ jià mǎi shān zī
  - time: 06:49.76
    text: 国色对仙姿。
    pinyin: guó sè duì xiān zī
  - time: 06:52.11
    text: 晚霞明似锦，春雨细如丝。
    pinyin: wǎn xiá míng sì jǐn chūn yǔ xì rú sī
  - time: 06:57.56
    text: 柳畔长堤千万树，花横野寺两三枝。
    pinyin: liǔ bàn cháng dī qiān wàn shù huā héng yě sì liǎng sān zhī
  - time: 07:04.93
    text: 紫盖黄旗，天象预占江左地；
    pinyin: zǐ gài huáng qí tiān xiàng yù zhān jiāng zuǒ dì
  - time: 07:10.28
    text: 青袍白马，童谣终应寿阳兒。
    pinyin: qīng páo bái mǎ tóng yáo zhōng yìng shòu yáng ní
  - time: 07:16.10
    text: 箴对赞，缶对卮。
    pinyin: zhēn duì zàn fǒu duì zhī
  - time: 07:20.00
    text: 萤炤对蚕丝。
    pinyin: yíng zhào duì cán sī
  - time: 07:22.67
    text: 轻裾对长袖，瑞草对灵芝。
    pinyin: qīng jū duì cháng xiù ruì cǎo duì líng zhī
  - time: 07:27.65
    text: 流涕策，断肠诗。
    pinyin: liú tì cè duàn cháng shī
  - time: 07:31.28
    text: 喉舌对腰肢。
    pinyin: hóu shé duì yāo zhī
  - time: 07:33.73
    text: 云中熊虎将，天上凤凰兒。
    pinyin: yún zhōng xióng hǔ jiàng tiān shàng fèng huáng ní
  - time: 07:39.27
    text: 禹庙千年垂橘柚，尧阶三尺覆茅茨。
    pinyin: yǔ miào qiān nián chuí jú yòu yáo jiē sān chǐ fù máo cí
  - time: 07:46.55
    text: 湘竹含烟，腰下轻纱笼玳瑁；
    pinyin: xiāng zhú hán yān yāo xià qīng shā lǒng dài mào
  - time: 07:52.07
    text: 海棠经雨，脸边清泪湿胭脂。
    pinyin: hǎi táng jīng yǔ liǎn biān qīng lèi shī yān zhī
  - time: 07:57.78
    text: 争对让，望对思。
    pinyin: zhēng duì ràng wàng duì sī
  - time: 08:01.58
    text: 野葛对山栀。
    pinyin: yě gé duì shān zhī
  - time: 08:04.00
    text: 仙风对道骨，天造对人为。
    pinyin: xiān fēng duì dào gǔ tiān zào duì rén wéi
  - time: 08:09.14
    text: 专诸剑，博浪椎。
    pinyin: zhuān zhū jiàn bó làng chuí
  - time: 08:12.86
    text: 经纬对干支。
    pinyin: jīng wěi duì gān zhī
  - time: 08:15.19
    text: 位尊民物主，德重帝王师。
    pinyin: wèi zūn mín wù zhǔ dé zhòng dì wáng shī
  - time: 08:20.31
    text: 望切不妨人去远，心忙无奈马行迟。
    pinyin: wàng qiè bù fáng rén qù yuǎn xīn máng wú nài mǎ xíng chí
  - time: 08:27.32
    text: 金屋闭来，赋乞茂陵题柱笔；
    pinyin: jīn wū bì lái fù qǐ mào líng tí zhù bǐ
  - time: 08:32.57
    text: 玉楼成后，记须昌谷负囊词。
    pinyin: yù lóu chéng hòu jì xū chāng gǔ fù náng cí
  - time: 08:38.38
    text: 五 微
    pinyin: wǔ wēi
  - time: 08:40.28
    text: 贤对圣，是对非。
    pinyin: xián duì shèng shì duì fēi
  - time: 08:43.79
    text: 觉奥对参微。
    pinyin: jué ào duì cān wēi
  - time: 08:46.61
    text: 鱼书对雁字，草舍对柴扉。
    pinyin: yú shū duì yàn zì cǎo shè duì chái fēi
  - time: 08:52.05
    text: 鸡晓唱，雉朝飞。
    pinyin: jī xiǎo chàng zhì zhāo fēi
  - time: 08:55.51
    text: 红瘦对绿肥。
    pinyin: hóng shòu duì lǜ féi
  - time: 08:58.15
    text: 举杯邀月饮，骑马踏花归。
    pinyin: jǔ bēi yāo yuè yǐn qí mǎ tà huā guī
  - time: 09:03.57
    text: 黄盖能成赤壁捷，陈平善解白登危。
    pinyin: huáng gài néng chéng chì bì jié chén píng shàn jiě bái dēng wēi
  - time: 09:10.46
    text: 太白书堂，瀑泉垂地三千丈；
    pinyin: tài bái shū táng pù quán chuí dì sān qiān zhàng
  - time: 09:15.81
