books:
  - key: san-zi-jing
    group: 1
    title: 三字经
    author: （宋）王应麟
    sentences: 191
    seconds: 680.91
    size: 4146048
    sha256sum: bbfd37c206e3ef3eefe26c3b22ffc25d91bba282555d55b38d6c5ee7e2e36980
    background: '#193cb8'
    intro: 《三字经》是中国的传统启蒙教材，是最浅显易懂的读本之一。《三字经》取材典范，包括中国传统文化的文学、历史、哲学、天文地理、人伦义理、忠孝节义等等，而核心思想又包括了“仁，义，诚，敬，孝。”背诵《三字经》的同时，就了解了常识、传统国学及历史故事，以及故事内涵中的做人做事道理。
  - key: bai-jia-xing
    group: 1
    title: 百家姓
    author: （北宋）无名氏
    sentences: 72
    seconds: 363.78
    size: 2215875
    sha256sum: c0d6d79fe137a82866d43810a4df6a0488d790f06bf7ec50f7cec16824b70387
    background: '#005f78'
    intro: 《百家姓》是一部关于汉字姓氏的作品，主要选取的是汉族姓氏。按文献记载，成文于北宋初年。原收集姓氏 411 个，后增补到 504 个，其中单姓 444 个，复姓 60 个。版本颇为丰富，尤以清代为甚。《百家姓》采用四言体例，对姓氏进行了排列，而且句句押韵，虽然它的内容没有文理，但对于中国姓氏文化的传承、中国文字的认识等方面都起了巨大作用，这也是能够流传千百年的一个重要因素。
  - key: qian-zi-wen
    group: 1
    title: 千字文
    author: （南梁）周兴嗣
    sentences: 126
    seconds: 659.57
    size: 4016304
    sha256sum: 6bb47a1ce83a354ae8398db2d0d14ada79e71cdcdd601d228e63a53ddf443cd3
    background: '#006045'
    intro: 《千字文》原名《次韵王羲之书千字》，是中国古代三大蒙学经典教材之一。南北朝时期梁朝，梁武帝萧衍为了教育皇室子女学习汉字和书法，命人从王羲之书法作品中选出 1000 个不重复的字，由散骑侍郎、给事中周兴嗣所编纂，周兴嗣耗费整夜时间，最终编成这篇《千字文》。内容涵盖天文史地、飞禽走兽、农业知识、道德规范、成语谚语等，被称为“千古奇文”。隋唐时，继续在社会上广泛流传。唐宋以后，一直在全国范围内被用作儿童启蒙的识字教材。
  - key: di-zi-gui
    group: 1
    title: 弟子规
    author: （清）李毓秀
    sentences: 180
    seconds: 695.88
    size: 4237058
    sha256sum: 7bda6ca1e9f22c6a9ac2623e96e7da75cbdf79a806fca20b5704ea4f6dea7f87
    background: '#3c6300'
    intro: 《弟子规》，原名《训蒙文》，是一本清朝出现的文学作品，以韵文写成。它从孔门四教之首的德行教育来入门，具体而微地阐述了求学之人应循的生活轨范与修学方法，即先扎德行根本，再求丰富学识，以为推动仁德事业之基础。一般认为作者是满清康熙年间的秀才李毓秀，后经贾存仁修订改编，改称《弟子规》。
