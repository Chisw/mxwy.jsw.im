key: qian-gua
sections:
  - 乾卦@2,20
  - 彖传@21,35
  - 象传@36,44
  - 文言@45,189
sentences:
  - time: 00:00.62
    text: 周易
    pinyin: zhōu yì
  - time: 00:02.21
    text: 乾 ䷀ 卦一
    pinyin: qián ䷀ guà yī
  - time: 00:05.49
    text: 乾下 ☰ 乾上 ☰
    pinyin: qián xià ☰ qián shàng ☰
  - time: 00:08.59
    text: 乾：
    pinyin: qián
  - time: 00:10.46
    text: 元亨，利贞。
    pinyin: yuán hēng lì zhēn
  - time: 00:13.67
    text: 初九：
    pinyin: chū jiǔ
  - time: 00:15.98
    text: 潜龙，勿用。
    pinyin: qián lóng wù yòng
  - time: 00:18.30
    text: 九二：
    pinyin: jiǔ èr
  - time: 00:20.04
    text: 见龙在田，利见大人。
    pinyin: xiàn lóng zài tián lì jiàn dà rén
  - time: 00:24.74
    text: 九三：
    pinyin: jiǔ sān
  - time: 00:26.72
    text: 君子终日乾乾，
    pinyin: jūn zǐ zhōng rì qián qián
  - time: 00:29.92
    text: 夕惕若，厉，无咎。
    pinyin: xī tì ruò lì wú jiù
  - time: 00:34.37
    text: 九四：
    pinyin: jiǔ sì
  - time: 00:36.69
    text: 或跃在渊，无咎。
    pinyin: huò yuè zài yuān wú jiù
  - time: 00:40.26
    text: 九五：
    pinyin: jiǔ wǔ
  - time: 00:42.46
    text: 飞龙在天，利见大人。
    pinyin: fēi lóng zài tiān lì jiàn dà rén
  - time: 00:47.21
    text: 上九：
    pinyin: shàng jiǔ
  - time: 00:49.87
    text: 亢龙有悔。
    pinyin: kàng lóng yóu huǐ
  - time: 00:52.83
    text: 用九：
    pinyin: yòng jiǔ
  - time: 00:55.06
    text: 见群龙无首，吉。
    pinyin: jiàn qún lóng wú shǒu jí
  - time: 00:59.20
    text: 彖曰：
    pinyin: tuàn yuē
  - time: 01:01.98
    text: 大哉乾元，
    pinyin: dà zāi qián yuán
  - time: 01:04.52
    text: 万物资始，
    pinyin: wàn wù zī shǐ
  - time: 01:06.80
    text: 乃统天。
    pinyin: nǎi tǒng tiān
  - time: 01:08.57
    text: 云行雨施，
    pinyin: yún xíng yǔ shī
  - time: 01:10.80
    text: 品物流形。
    pinyin: pǐn wù liú xíng
  - time: 01:12.93
    text: 大明终始，
    pinyin: dà míng zhōng shǐ
  - time: 01:15.29
    text: 六位时成，
    pinyin: liù wèi shí chéng
  - time: 01:17.34
    text: 时乘六龙以御天。
    pinyin: shí chéng liù lóng yǐ yù tiān
  - time: 01:21.12
    text: 乾道变化，
    pinyin: qián dào biàn huà
  - time: 01:23.64
    text: 各正性命，
    pinyin: gè zhèng xìng mìng
  - time: 01:26.00
    text: 保合大和，
    pinyin: bǎo hé tài hé
  - time: 01:28.08
    text: 乃利贞。
    pinyin: nǎi lì zhēn
  - time: 01:29.95
    text: 首出庶物，
    pinyin: shǒu chū shù wù
  - time: 01:31.93
    text: 万国咸宁。
    pinyin: wàn guó xián níng
  - time: 01:36.46
    text: 象曰：
    pinyin: xiàng yuē
  - time: 01:38.53
    text: 天行健，君子以自强不息。
    pinyin: tiān xíng jiàn jūn zǐ yǐ zì qiáng bù xī
  - time: 01:43.90
    text: 潜龙勿用，阳在下也。
    pinyin: qián lóng wù yòng yáng zài xià yě
  - time: 01:48.99
    text: 见龙在田，德施普也。
    pinyin: xiàn lóng zài tián dé shī pǔ yě
  - time: 01:53.47
    text: 终日乾乾，反复道也。
    pinyin: zhōng rì qián qián fǎn fù dào yě
  - time: 01:57.67
    text: 或跃在渊，进无咎也。
    pinyin: huò yuè zài yuān jìn wú jiù yě
  - time: 02:02.05
    text: 飞龙在天，大人造也。
    pinyin: fēi lóng zài tiān dà rén zào yě
  - time: 02:06.22
    text: 亢龙有悔，盈不可久也。
    pinyin: kàng lóng yóu huǐ yíng bù kě jiǔ yě
  - time: 02:11.29
    text: 用九，天德不可为首也。
    pinyin: yòng jiǔ tiān dé bù kě wéi shǒu yě
  - time: 02:17.48
    text: 《文言》曰：
    pinyin: wén yán yuē
  - time: 02:19.33
    text: “元”者，善之长也；
    pinyin: yuán zhě shàn zhī zhǎng yě
  - time: 02:22.60
    text: “亨”者，嘉之会也；
    pinyin: hēng zhě jiā zhī huì yě
  - time: 02:25.46
    text: “利”者，义之和也；
    pinyin: lì zhě yì zhī hé yě
  - time: 02:28.55
    text: “贞”者，事之干也。
    pinyin: zhēn zhě shì zhī gàn yě
  - time: 02:31.50
    text: 君子体仁足以长人，
    pinyin: jūn zǐ tǐ rén zú yǐ zhǎng rén
  - time: 02:35.24
    text: 嘉会足以合礼，
    pinyin: jiā huì zú yǐ hé lǐ
  - time: 02:37.85
    text: 利物足以和义，
    pinyin: lì wù zú yǐ hé yì
  - time: 02:40.59
    text: 贞固足以干事。
    pinyin: zhēn gù zú yǐ gàn shì
  - time: 02:43.36
    text: 君子行此四德者，
    pinyin: jūn zǐ xíng cǐ sì dé zhě
  - time: 02:46.96
    text: 故曰“乾、元、亨、利、贞”。
    pinyin: gù yuē qián yuán hēng lì zhēn
  - time: 02:51.75
    text: 初九曰：
    pinyin: chū jiǔ yuē
  - time: 02:53.85
    text: “潜龙勿用”，
    pinyin: qián lóng wù yòng
  - time: 02:55.35
    text: 何谓也？
    pinyin: hé wèi yě
  - time: 02:57.08
    text: 子曰：
    pinyin: zǐ yuē
  - time: 02:58.53
    text: “龙，德而隐者也。
    pinyin: lóng dé ér yǐn zhě yě
  - time: 03:01.96
    text: 不易世，
    pinyin: bú yì shì
  - time: 03:03.76
    text: 不成名，
    pinyin: bù chéng míng
  - time: 03:05.16
    text: 遯世无闷，
    pinyin: dùn shì wú mèn
  - time: 03:07.38
    text: 不见是而无闷。
    pinyin: bú jiàn shì ér wú mèn
  - time: 03:10.33
    text: 乐则行之，
    pinyin: lè zé xíng zhī
  - time: 03:12.68
    text: 忧则违之，
    pinyin: yōu zé wéi zhī
  - time: 03:14.67
    text: 确乎其不可拔，
    pinyin: què hū qí bù kě bá
  - time: 03:17.53
    text: 潜龙也。”
    pinyin: qián lóng yě
  - time: 03:18.99
    text: 九二曰：
    pinyin: jiǔ èr yuē
  - time: 03:21.23
    text: “见龙在田，利见大人”，
    pinyin: xiàn lóng zài tián lì jiàn dà rén
  - time: 03:24.71
    text: 何谓也？
    pinyin: hé wèi yě
  - time: 03:26.21
    text: 子曰：
    pinyin: zǐ yuē
  - time: 03:27.78
    text: “龙德而正中者也。
    pinyin: lóng dé ér zhèng zhōng zhě yě
  - time: 03:31.41
    text: 庸言之信，庸行之谨，
    pinyin: yōng yán zhī xìn yōng xíng zhī jǐn
  - time: 03:35.27
    text: 闲邪存其诚，善世而不伐，
    pinyin: xián xié cún qí chéng shàn shì ér bù fá
  - time: 03:40.30
    text: 德博而化。
    pinyin: dé bó ér huà
  - time: 03:42.02
    text: 《易》曰：
    pinyin: yì yuē
  - time: 03:43.52
    text: ‘见龙在田，利见大人’，
    pinyin: xiàn lóng zài tián lì jiàn dà rén
  - time: 03:47.53
    text: 君德也。”
    pinyin: jūn dé yě
  - time: 03:49.55
    text: 九三曰：
    pinyin: jiǔ sān yuē
  - time: 03:51.84
    text: “君子终日乾乾、
    pinyin: jūn zǐ zhōng rì qián qián
  - time: 03:54.54
    text: 夕惕若、厉、无咎”。
    pinyin: xī tì ruò lì wú jiù
  - time: 03:58.01
    text: 何谓也？
    pinyin: hé wèi yě
  - time: 03:59.60
    text: 子曰：
    pinyin: zǐ yuē
  - time: 04:01.32
    text: “君子进德修业，
    pinyin: jūn zǐ jìn dé xiū yè
  - time: 04:04.51
    text: 忠信，所以进德也，
    pinyin: zhōng xìn suǒ yǐ jìn dé yě
  - time: 04:08.05
    text: 修辞立其诚，所以居业也。
    pinyin: xiū cí lì qí chéng suǒ yǐ jū yè yě
  - time: 04:12.33
    text: 知至至之，可与言几也，
    pinyin: zhī zhì zhì zhī kě yǔ yán jī yě
  - time: 04:17.33
    text: 知终终之，可与存义也。
    pinyin: zhī zhōng zhōng zhī kě yǔ cún yì yě
  - time: 04:21.67
    text: 是故居上位而不骄，
    pinyin: shì gù jū shàng wèi ér bù jiāo
  - time: 04:25.44
    text: 在下位而不忧，
    pinyin: zài xià wèi ér bù yōu
  - time: 04:28.14
    text: 故乾乾因其时而惕，
    pinyin: gù qián qián yīn qí shí ér tì
  - time: 04:32.00
    text: 虽危无咎矣。”
    pinyin: suī wēi wú jiù yǐ
  - time: 04:34.67
    text: 九四曰：
    pinyin: jiǔ sì yuē
  - time: 04:37.48
    text: “或跃在渊，无咎。”
    pinyin: huò yuè zài yuān wú jiù
  - time: 04:40.81
    text: 何谓也？
    pinyin: hé wèi yě
  - time: 04:42.27
    text: 子曰：
    pinyin: zǐ yuē
  - time: 04:44.01
    text: “上下无常，非为邪也。
    pinyin: shàng xià wú cháng fēi wèi xié yě
  - time: 04:47.96
    text: 进退无恒，非离群也。
    pinyin: jìn tuì wú héng fēi lí qún yě
  - time: 04:52.14
    text: 君子进德修业，欲及时也，
    pinyin: jūn zǐ jìn dé xiū yè yù jí shí yě
  - time: 04:57.09
    text: 故无咎。”
    pinyin: gù wú jiù
  - time: 04:59.16
    text: 九五曰：
    pinyin: jiǔ wǔ yuē
  - time: 05:01.91
    text: “飞龙在天，利见大人”。
    pinyin: fēi lóng zài tiān lì jiàn dà rén
  - time: 05:06.12
    text: 何谓也？
    pinyin: hé wèi yě
  - time: 05:07.68
    text: 子曰：
    pinyin: zǐ yuē
  - time: 05:09.54
    text: “同声相应，
    pinyin: tóng shēng xiāng yīng
  - time: 05:11.62
    text: 同气相求。
    pinyin: tóng qì xiāng qiú
  - time: 05:13.64
    text: 水流湿，
    pinyin: shuǐ liú shī
  - time: 05:15.37
    text: 火就燥，
    pinyin: huǒ jiù zào
  - time: 05:16.81
    text: 云从龙，
    pinyin: yún cóng lóng
  - time: 05:18.55
    text: 风从虎，
    pinyin: fēng cóng hǔ
  - time: 05:20.05
    text: 圣人作而万物覩。
    pinyin: shèng rén zuò ér wàn wù dǔ
  - time: 05:23.20
    text: 本乎天者亲上，
    pinyin: běn hū tiān zhě qīn shàng
  - time: 05:25.80
    text: 本乎地者亲下，
    pinyin: běn hū dì zhě qīn xià
  - time: 05:28.48
    text: 则各从其类也。”
    pinyin: zé gè cóng qí lèi yě
  - time: 05:31.46
    text: 上九曰：
    pinyin: shàng jiǔ yuē
  - time: 05:33.94
    text: “亢龙有悔”，
    pinyin: kàng lóng yóu huǐ
  - time: 05:35.76
    text: 何谓也？
    pinyin: hé wèi yě
  - time: 05:37.26
    text: 子曰：
    pinyin: zǐ yuē
  - time: 05:38.83
    text: “贵而无位，高而无民，
    pinyin: guì ér wú wèi gāo ér wú mín
  - time: 05:42.31
    text: 贤人在下位而无辅，
    pinyin: xián rén zài xià wèi ér wú fǔ
  - time: 05:45.98
    text: 是以动而有悔也。”
    pinyin: shì yǐ dòng ér yóu huǐ yě
  - time: 05:49.47
    text: “潜龙勿用”，下也；
    pinyin: qián lóng wù yòng xià yě
  - time: 05:53.88
    text: “见龙在田”，时舍也；
    pinyin: xiàn lóng zài tián shí shè yě
  - time: 05:57.59
    text: “终日乾乾”，行事也；
    pinyin: zhōng rì qián qián xíng shì yě
  - time: 06:01.42
    text: “或跃在渊”，自试也；
    pinyin: huò yuè zài yuān zì shì yě
  - time: 06:05.11
    text: “飞龙在天”，上治也；
    pinyin: fēi lóng zài tiān shàng zhì yě
  - time: 06:09.05
    text: “亢龙有悔”、穷之灾也。
    pinyin: kàng lóng yóu huǐ qióng zhī zāi yě
  - time: 06:13.35
    text: 乾元“用九”，天下治也。
    pinyin: qián yuán yòng jiǔ tiān xià zhì yě
  - time: 06:18.42
    text: “潜龙勿用”，阳气潜藏。
    pinyin: qián lóng wù yòng yáng qì qián cáng
  - time: 06:23.12
    text: “见龙在田”，天下文明。
    pinyin: xiàn lóng zài tián tiān xià wén míng
  - time: 06:27.38
    text: “终日乾乾”，与时偕行。
    pinyin: zhōng rì qián qián yǔ shí xié xíng
  - time: 06:31.65
    text: “或跃在渊”，乾道乃革。
    pinyin: huò yuè zài yuān qián dào nǎi gé
  - time: 06:35.81
    text: “飞龙在天”，乃位乎天德。
    pinyin: fēi lóng zài tiān nǎi wèi hū tiān dé
  - time: 06:40.27
    text: “亢龙有悔”，与时偕极。
    pinyin: kàng lóng yóu huǐ yǔ shí xié jí
  - time: 06:44.75
    text: 乾元“用九”，乃见天则。
    pinyin: qián yuán yòng jiǔ nǎi jiàn tiān zé
  - time: 06:49.28
    text: 《乾》“元”者，始而亨者也。
    pinyin: qián yuán zhě shǐ ér hēng zhě yě
  - time: 06:54.23
    text: “利贞”者，性情也。
    pinyin: lì zhēn zhě xìng qíng yě
  - time: 06:57.72
    text: 乾始能以美利利天下，
    pinyin: qián shǐ néng yǐ měi lì lì tiān xià
  - time: 07:01.74
    text: 不言所利，
    pinyin: bù yán suǒ lì
  - time: 07:03.59
    text: 大矣哉！
    pinyin: dà yǐ zāi
  - time: 07:05.44
    text: 大哉乾乎！
    pinyin: dà zāi qián hū
  - time: 07:07.57
    text: 刚健中正，纯粹精也。
    pinyin: gāng jiàn zhōng zhèng chún cuì jīng yě
  - time: 07:11.94
    text: 六爻发挥，旁通情也。
    pinyin: liù yáo fā huī páng tōng qíng yě
  - time: 07:16.06
    text: “时乘六龙”、以“御天”也，
    pinyin: shí chéng liù lóng yǐ yù tiān yě
  - time: 07:20.46
    text: “云行雨施”、天下平也。
    pinyin: yún xíng yǔ shī tiān xià píng yě
  - time: 07:24.85
    text: 君子以成德为行，
    pinyin: jūn zǐ yǐ chéng dé wéi xíng
  - time: 07:27.50
    text: 日可见之行也。
    pinyin: rì kě jiàn zhī xíng yě
  - time: 07:30.66
    text: “潜”之为言也，
    pinyin: qián zhī wéi yán yě
  - time: 07:33.12
    text: 隐而未见，
    pinyin: yǐn ér wèi xiàn
  - time: 07:34.92
    text: 行而未成，
    pinyin: xíng ér wèi chéng
  - time: 07:36.95
    text: 是以君子“弗用”也。
    pinyin: shì yǐ jūn zǐ fú yòng yě
  - time: 07:40.73
    text: 君子学以聚之，
    pinyin: jūn zǐ xué yǐ jù zhī
  - time: 07:44.08
    text: 问以辩之，
    pinyin: wèn yǐ biàn zhī
  - time: 07:45.99
    text: 宽以居之，
    pinyin: kuān yǐ jū zhī
  - time: 07:47.95
    text: 仁以行之。
    pinyin: rén yǐ xíng zhī
  - time: 07:50.18
    text: 《易》曰：
    pinyin: yì yuē
  - time: 07:51.58
    text: “见龙在田、利见大人”，
    pinyin: xiàn lóng zài tián lì jiàn dà rén
  - time: 07:55.36
    text: 君德也。
    pinyin: jūn dé yě
  - time: 07:57.07
    text: 九三重刚而不中，
    pinyin: jiǔ sān chóng gāng ér bù zhōng
  - time: 08:00.91
    text: 上不在天，
    pinyin: shàng bú zài tiān
  - time: 08:02.94
    text: 下不在田，
    pinyin: xià bú zài tián
  - time: 08:04.72
    text: 故“乾乾”因其时而“惕”，
    pinyin: gù qián qián yīn qí shí ér tì
  - time: 08:08.37
    text: 虽危“无咎”矣。
    pinyin: suī wēi wú jiù yǐ
  - time: 08:11.00
    text: 九四重刚而不中，
    pinyin: jiǔ sì chóng gāng ér bù zhōng
  - time: 08:15.10
    text: 上不在天，
    pinyin: shàng bú zài tiān
  - time: 08:17.01
    text: 下不在田，
    pinyin: xià bú zài tián
  - time: 08:18.75
    text: 中不在人，
    pinyin: zhōng bú zài rén
  - time: 08:20.65
    text: 故“或”之。
    pinyin: gù huò zhī
  - time: 08:23.03
    text: “或”之者，
    pinyin: huò zhī zhě
  - time: 08:24.31
    text: 疑之也，
    pinyin: yí zhī yě
  - time: 08:25.87
    text: 故“无咎”。
    pinyin: gù wú jiù
  - time: 08:27.92
    text: 夫“大人”者、
    pinyin: fú dà rén zhě
  - time: 08:30.86
    text: 与天地合其德，
    pinyin: yǔ tiān dì hé qí dé
  - time: 08:33.33
    text: 与日月合其明，
    pinyin: yǔ rì yuè hé qí míng
  - time: 08:36.21
    text: 与四时合其序，
    pinyin: yǔ sì shí hé qí xù
  - time: 08:39.17
    text: 与鬼神合其吉凶，
    pinyin: yǔ guǐ shén hé qí jí xiōng
  - time: 08:42.46
    text: 先天而天弗违，
    pinyin: xiān tiān ér tiān fú wéi
  - time: 08:45.66
    text: 后天而奉天时。
    pinyin: hòu tiān ér fèng tiān shí
  - time: 08:48.64
    text: 天且弗违，
    pinyin: tiān qiě fú wéi
  - time: 08:50.73
    text: 而况于人乎？
    pinyin: ér kuàng yú rén hū
  - time: 08:53.01
    text: 况于鬼神乎？
    pinyin: kuàng yú guǐ shén hū
  - time: 08:55.82
    text: “亢”之为言也，
    pinyin: kàng zhī wéi yán yě
  - time: 08:58.82
    text: 知进而不知退，
    pinyin: zhī jìn ér bù zhī tuì
  - time: 09:01.28
    text: 知存而不知亡，
    pinyin: zhī cún ér bù zhī wáng
  - time: 09:04.04
    text: 知得而不知丧。
    pinyin: zhī dé ér bù zhī sàng
  - time: 09:06.92
    text: 其唯圣人乎！
    pinyin: qí wéi shèng rén hū
  - time: 09:09.46
    text: 知进退存亡而不失其正者，
    pinyin: zhī jìn tuì cún wáng ér bù shī qí zhèng zhě
  - time: 09:14.15
    text: 其唯圣人乎！
    pinyin: qí wéi shèng rén hū
