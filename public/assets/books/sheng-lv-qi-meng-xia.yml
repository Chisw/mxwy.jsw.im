sentences:
  - time: 00:00.81
    text: 一 先
    pinyin: yī xiān
  - time: 00:02.73
    text: 晴对雨，地对天，天地对山川。
    pinyin: qíng duì yǔ dì duì tiān tiān dì duì shān chuān
  - time: 00:08.98
    text: 山川对草木，赤壁对青田。
    pinyin: shān chuān duì cǎo mù chì bì duì qīng tián
  - time: 00:14.42
    text: 郏鄏鼎，武城弦，木笔对苔钱。
    pinyin: jiá rǔ dǐng wǔ chéng xián mù bǐ duì tái qián
  - time: 00:20.33
    text: 金城三月柳，玉井九秋莲。
    pinyin: jīn chéng sān yuè liǔ yù jǐng jiǔ qiū lián
  - time: 00:25.74
    text: 何处春朝风景好，谁家秋夜月华圆。
    pinyin: hé chù chūn zhāo fēng jǐng hǎo shuí jiā qiū yè yuè huá yuán
  - time: 00:32.78
    text: 珠缀花梢，千点蔷薇香露；
    pinyin: zhū zhuì huā shāo qiān diǎn qiáng wēi xiāng lù
  - time: 00:38.25
    text: 练横树杪，几丝杨柳残烟。
    pinyin: liàn héng shù miǎo jǐ sī yáng liǔ cán yān
  - time: 00:44.24
    text: 前对后，后对先，众丑对孤妍。
    pinyin: qián duì hòu hòu duì xiān zhòng chǒu duì gū yán
  - time: 00:50.38
    text: 莺簧对蝶板，虎穴对龙渊。
    pinyin: yīng huáng duì dié bǎn hǔ xué duì lóng yuān
  - time: 00:55.61
    text: 击石磬，观韦编，鼠目对鸢肩。
    pinyin: jī shí qìng guān wéi biān shǔ mù duì yuān jiān
  - time: 01:01.84
    text: 春园花柳地，秋沼芰荷天。
    pinyin: chūn yuán huā liǔ dì qiū zhǎo jì hé tiān
  - time: 01:07.76
    text: 白羽频挥闲客坐，乌纱半坠醉翁眠。
    pinyin: bái yǔ pín huī xián kè zuò wū shā bàn zhuì zuì wēng mián
  - time: 01:14.32
    text: 野店几家，羊角风摇沽酒旆；
    pinyin: yě diàn jǐ jiā yáng jiǎo fēng yáo gū jiǔ pèi
  - time: 01:19.47
    text: 长川一带，鸭头波泛卖鱼船。
    pinyin: cháng chuān yí dài yā tóu bō fàn mài yú chuán
  - time: 01:25.59
    text: 离对坎，震对乾，一日对千年。
    pinyin: lí duì kǎn zhèn duì qián yí rì duì qiān nián
  - time: 01:31.52
    text: 尧天对舜日，蜀水对秦川。
    pinyin: yáo tiān duì shùn rì shǔ shuǐ duì qín chuān
  - time: 01:36.66
    text: 苏武节，郑虔毡，涧壑对林泉。
    pinyin: sū wǔ jié zhèng qián zhān jiàn hè duì lín quán
  - time: 01:42.49
    text: 挥戈能退日，持管莫窥天。
    pinyin: huī gē néng tuì rì chí guǎn mò kuī tiān
  - time: 01:47.35
    text: 寒食芳辰花烂熳，中秋佳节月婵娟。
    pinyin: hán shí fāng chén huā làn màn zhōng qiū jiā jié yuè chán juān
  - time: 01:54.22
    text: 梦里荣华，飘忽枕中之客；
    pinyin: mèng lǐ róng huá piāo hū zhěn zhōng zhī kè
  - time: 01:59.07
    text: 壶中日月，安闲市上之仙。
    pinyin: hú zhōng rì yuè ān xián shì shàng zhī xiān
  - time: 02:03.93
    text: 二 萧
    pinyin: èr xiāo
  - time: 02:07.10
    text: 恭对慢，吝对骄，水远对山遥。
    pinyin: gōng duì màn lìn duì jiāo shuǐ yuǎn duì shān yáo
  - time: 02:12.75
    text: 松轩对竹槛，雪赋对风谣。
    pinyin: sōng xuān duì zhú jiàn xuě fù duì fēng yáo
  - time: 02:18.41
    text: 乘五马，贯双雕，烛灭对香消。
    pinyin: chéng wú mǎ guàn shuāng diāo zhú miè duì xiāng xiāo
  - time: 02:24.20
    text: 明蟾常彻夜，骤雨不终朝。
    pinyin: míng chán cháng chè yè zhòu yǔ bù zhōng zhāo
  - time: 02:29.36
    text: 楼阁天凉风飒飒，关河地隔雨潇潇。
    pinyin: lóu gé tiān liáng fēng sà sà guān hé dì gé yǔ xiāo xiāo
  - time: 02:36.62
    text: 几点鹭鸶，日暮常飞红蓼岸；
    pinyin: jǐ diǎn lù sī rì mù cháng fēi hóng liǎo àn
  - time: 02:42.05
    text: 一双鸂鶒，春朝频泛绿杨桥。
    pinyin: yì shuāng xī chì chūn zhāo pín fàn lǜ yáng qiáo
  - time: 02:47.97
    text: 开对落，暗对昭，赵瑟对虞韶。
    pinyin: kāi duì luò àn duì zhāo zhào sè duì yú sháo
  - time: 02:54.73
    text: 轺车对驿骑，锦绣对琼瑶。
    pinyin: yáo chē duì yì jì jǐn xiù duì qióng yáo
  - time: 02:59.80
    text: 羞攘臂，懒折腰，范甑对颜瓢。
    pinyin: xiū rǎng bì lǎn zhé yāo fàn zèng duì yán piáo
  - time: 03:05.70
    text: 寒天鸳帐酒，夜月凤台箫。
    pinyin: hán tiān yuān zhàng jiǔ yè yuè fèng tái xiāo
  - time: 03:11.21
    text: 舞女腰肢杨柳软，佳人颜貌海棠娇。
    pinyin: wǔ nǚ yāo zhī yáng liǔ ruǎn jiā rén yán mào hǎi táng jiāo
  - time: 03:17.89
    text: 豪客寻春，南陌草青香阵阵；
    pinyin: háo kè xún chūn nán mò cǎo qīng xiāng zhèn zhèn
  - time: 03:23.56
    text: 闲人避暑，东堂蕉绿影摇摇。
    pinyin: xián rén bì shǔ dōng táng jiāo lǜ yǐng yáo yáo
  - time: 03:29.71
    text: 班对马，董对晁，夏昼对春宵。
    pinyin: bān duì mǎ dǒng duì cháo xià zhòu duì chūn xiāo
  - time: 03:36.73
    text: 雷声对电影，麦穗对禾苗。
    pinyin: léi shēng duì diàn yǐng mài suì duì hé miáo
  - time: 03:42.03
    text: 八千路，廿四桥，总角对垂髫。
    pinyin: bā qiān lù niàn sì qiáo zǒng jiǎo duì chuí tiáo
  - time: 03:48.05
    text: 露桃匀嫩脸，风柳舞纤腰。
    pinyin: lù táo yún nèn liǎn fēng liǔ wǔ xiān yāo
  - time: 03:53.48
    text: 贾谊赋成伤鵩鸟，周公诗就托鸱鸮。
    pinyin: jiǎ yì fù chéng shāng fú niǎo zhōu gōng shī jiù tuō chī xiāo
  - time: 04:00.34
    text: 幽寺寻僧，逸兴岂知俄尔尽；
    pinyin: yōu sì xún sēng yì xìng qǐ zhī é ěr jìn
  - time: 04:06.10
    text: 长亭送客，离魂不觉黯然消。
    pinyin: cháng tíng sòng kè lí hún bù jué àn rán xiāo
  - time: 04:13.18
    text: 三 肴
    pinyin: sān yáo
  - time: 04:15.26
    text: 风对雅，象对爻，巨蟒对长蛟。
    pinyin: fēng duì yǎ xiàng duì yáo jù mǎng duì cháng jiāo
  - time: 04:21.06
    text: 天文对地理，蟋蟀对螵蛸。
    pinyin: tiān wén duì dì lǐ xī shuài duì piāo xiāo
  - time: 04:26.50
    text: 龙夭矫，虎咆哮，北学对东胶。
    pinyin: lóng yāo jiǎo hǔ páo xiào běi xué duì dōng jiāo
  - time: 04:32.63
    text: 筑台须垒土，成屋必诛茅。
    pinyin: zhù tái xū lěi tǔ chéng wū bì zhū máo
  - time: 04:37.72
    text: 潘岳不忘秋兴赋，边韶常被昼眠嘲。
    pinyin: pān yuè bù wàng qiū xìng fù biān sháo cháng bèi zhòu mián cháo
  - time: 04:45.29
    text: 抚养群黎，已见国家隆治；
    pinyin: fǔ yǎng qún lí yǐ jiàn guó jiā lóng zhì
  - time: 04:50.17
    text: 滋生万物，方知天地泰交。
    pinyin: zī shēng wàn wù fāng zhī tiān dì tài jiāo
  - time: 04:55.19
    text: 蛇对虺，蜃对蛟，麟薮对鹊巢。
    pinyin: shé duì huǐ shèn duì jiāo lín sǒu duì què cháo
  - time: 05:01.33
    text: 风声对月色，麦穗对桑苞。
    pinyin: fēng shēng duì yuè sè mài suì duì sāng bāo
  - time: 05:06.50
    text: 何妥难，子云嘲，楚甸对商郊。
    pinyin: hé tuǒ nàn zǐ yún cháo chǔ diàn duì shāng jiāo
  - time: 05:12.38
    text: 五音惟耳听，万虑在心包。
    pinyin: wǔ yīn wéi ěr tīng wàn lǜ zài xīn bāo
  - time: 05:17.77
    text: 晋假虞途输重璧，齐临楚境责包茅。
    pinyin: jìn jiǎ yú tú shū zhòng bì qí lín chǔ jìng zé bāo máo
    annotation:
      15: 请注意！本句暂未找到与朗读声音相同的文本，完全是自编的。大多数刻本为：葛被汤征因仇饷，楚遭齐伐责包茅。
  - time: 05:24.63
    text: 高矣若天，洵是圣人大道；
    pinyin: gāo yǐ ruò tiān xún shì shèng rén dà dào
  - time: 05:29.95
    text: 淡而如水，实为君子神交。
    pinyin: dàn ér rú shuǐ shí wéi jūn zǐ shén jiāo
  - time: 05:34.93
    text: 牛对马，犬对猫，旨酒对嘉肴。
    pinyin: niú duì mǎ quǎn duì māo zhǐ jiǔ duì jiā yáo
  - time: 05:40.89
    text: 桃红对柳绿，竹叶对松梢。
    pinyin: táo hóng duì liǔ lǜ zhú yè duì sōng shāo
  - time: 05:45.98
    text: 藜杖叟，布衣樵，北野对东郊。
    pinyin: lí zhàng sǒu bù yī qiáo běi yě duì dōng jiāo
  - time: 05:51.42
    text: 白驹形皎皎，黄鸟语交交。
    pinyin: bái jū xíng jiǎo jiǎo huáng niǎo yǔ jiāo jiāo
  - time: 05:56.92
    text: 花圃春残无客到，柴门夜永有僧敲。
    pinyin: huā pǔ chūn cán wú kè dào chái mén yè yǒng yǒu sēng qiāo
  - time: 06:03.57
    text: 墙畔佳人，飘扬竞把秋千舞；
    pinyin: qiáng pàn jiā rén piāo yáng jìng bǎ qiū qiān wǔ
  - time: 06:09.32
    text: 楼前公子，笑语争将蹴踘抛。
    pinyin: lóu qián gōng zǐ xiào yǔ zhēng jiāng cù jū pāo
  - time: 06:16.39
    text: 四 豪
    pinyin: sì háo
  - time: 06:18.44
    text: 琴对瑟，剑对刀，地迥对天高。
    pinyin: qín duì sè jiàn duì dāo dì jiǒng duì tiān gāo
  - time: 06:24.35
    text: 峨冠对博带，紫绶对绯袍。
    pinyin: é guān duì bó dài zǐ shòu duì fēi páo
  - time: 06:29.50
    text: 煎异茗，酌香醪，虎兕对猿猱。
    pinyin: jiān yì míng zhuó xiāng láo hǔ sì duì yuán náo
  - time: 06:35.44
    text: 武夫攻骑射，野妇务蚕缫。
    pinyin: wǔ fū gōng qí shè yě fù wù cán sāo
  - time: 06:40.66
    text: 秋雨一川淇澳竹，春风两岸武陵桃。
    pinyin: qiū yǔ yì chuān qí yù zhú chūn fēng liǎng àn wǔ líng táo
  - time: 06:47.45
    text: 螺髻青浓，楼外晚山千仞；
    pinyin: luó jì qīng nóng lóu wài wǎn shān qiān rèn
  - time: 06:53.21
    text: 鸭头绿腻，溪中春水半篙。
    pinyin: yā tóu lǜ nì xī zhōng chūn shuǐ bàn gāo
  - time: 06:58.65
    text: 刑对赏，贬对褒，破斧对征袍。
    pinyin: xíng duì shǎng biǎn duì bāo pò fǔ duì zhēng páo
  - time: 07:05.25
    text: 梧桐对橘柚，枳棘对蓬蒿。
    pinyin: wú tóng duì jú yòu zhǐ jí duì péng hāo
  - time: 07:10.50
    text: 雷焕剑，吕虔刀，橄榄对葡萄。
    pinyin: léi huàn jiàn lǚ qián dāo gǎn lǎn duì pú táo
  - time: 07:15.93
    text: 一椽书舍小，百尺酒楼高。
    pinyin: yì chuán shū shè xiǎo bǎi chǐ jiǔ lóu gāo
  - time: 07:21.12
    text: 李白能诗时秉笔，刘伶爱酒每哺糟。
    pinyin: lǐ bái néng shī shí bǐng bǐ liú líng ài jiǔ měi bū zāo
  - time: 07:28.02
    text: 礼别尊卑，拱北众星常灿灿；
    pinyin: lǐ bié zūn bēi gǒng běi zhòng xīng cháng càn càn
  - time: 07:33.97
    text: 势分高下，朝东万水自滔滔。
    pinyin: shì fēn gāo xià cháo dōng wàn shuǐ zì tāo tāo
  - time: 07:40.00
    text: 瓜对果，李对桃，犬子对羊羔。
    pinyin: guā duì guǒ lǐ duì táo quǎn zǐ duì yáng gāo
  - time: 07:45.94
    text: 春分对夏至，谷水对山涛。
    pinyin: chūn fēn duì xià zhì gǔ shuǐ duì shān tāo
  - time: 07:51.09
    text: 双凤翼，九牛毛，主逸对臣劳。
    pinyin: shuāng fèng yì jiǔ niú máo zhǔ yì duì chén láo
  - time: 07:57.32
    text: 水流无限阔，山耸有余高。
    pinyin: shuǐ liú wú xiàn kuò shān sǒng yǒu yú gāo
  - time: 08:02.61
    text: 雨打村童新牧笠，尘生边将旧征袍。
    pinyin: yǔ dǎ cūn tóng xīn mù lì chén shēng biān jiàng jiù zhēng páo
  - time: 08:09.45
    text: 俊士居官，荣引鹓雏之序；
    pinyin: jùn shì jū guān róng yǐn yuān chú zhī xù
    annotation:
      9: 鹓雏：鹓鶵。
  - time: 08:14.74
    text: 忠臣报国，誓殚犬马之劳。
    pinyin: zhōng chén bào guó shì dān quǎn mǎ zhī láo
  - time: 08:20.23
    text: 五 歌
    pinyin: wǔ gē
  - time: 08:22.58
    text: 山对水，海对河，雪竹对烟萝。
    pinyin: shān duì shuǐ hǎi duì hé xuě zhú duì yān luó
  - time: 08:28.73
    text: 新欢对旧恨，痛饮对高歌。
    pinyin: xīn huān duì jiù hèn tòng yǐn duì gāo gē
  - time: 08:34.26
    text: 琴再抚，剑重磨，媚柳对枯荷。
    pinyin: qín zài fǔ jiàn chóng mó mèi liǔ duì kū hé
  - time: 08:40.48
    text: 荷盘从雨洗，柳线任风搓。
    pinyin: hé pán cóng yǔ xǐ liǔ xiàn rèn fēng cuō
  - time: 08:45.98
    text: 饮酒岂知欹醉帽，观棋不觉烂樵柯。
    pinyin: yǐn jiǔ qǐ zhī qī zuì mào guān qí bù jué làn qiáo kē
  - time: 08:52.44
    text: 山寺清幽，直踞千寻云岭；
    pinyin: shān sì qīng yōu zhí jù qiān xún yún lǐng
  - time: 08:57.62
    text: 江楼宏敞，遥临万顷烟波。
    pinyin: jiāng lóu hóng chǎng yáo lín wàn qǐng yān bō
  - time: 09:03.05
    text: 繁对简，少对多，里咏对途歌。
    pinyin: fán duì jiǎn shǎo duì duō lǐ yǒng duì tú gē
  - time: 09:09.70
    text: 宦情对旅况，银鹿对铜驼。
    pinyin: huàn qíng duì lǚ kuàng yín lù duì tóng tuó
  - time: 09:15.20
    text: 刺史鸭，将军鹅，玉律对金科。
    pinyin: cì shǐ yā jiāng jūn é yù lǜ duì jīn kē
  - time: 09:21.15
    text: 古堤垂老柳，曲沼长新荷。
    pinyin: gǔ dī chuí lǎo liǔ qū zhǎo zhǎng xīn hé
    annotation:
      4: 一作 亸 duǒ
  - time: 09:26.63
    text: 命驾吕因思叔夜，引车蔺为避廉颇。
    pinyin: mìng jià lǚ yīn sī shū yè yǐn chē lìn wèi bì lián pō
  - time: 09:33.28
    text: 千尺水帘，今古无人能手卷；
    pinyin: qiān chǐ shuǐ lián jīn gǔ wú rén néng shǒu juǎn
  - time: 09:38.87
    text: 一轮月镜，乾坤何匠用功磨。
    pinyin: yì lún yuè jìng qián kūn hé jiàng yòng gōng mó
  - time: 09:44.58
    text: 霜对露，浪对波，径菊对池荷。
