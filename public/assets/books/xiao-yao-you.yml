sentences:
  - time: 00:00.60
    text: 逍遥游
    pinyin: xiāo yáo yóu
  - time: 00:03.18
    text: 北冥有鱼，其名为鲲。
    pinyin: běi míng yǒu yú qí míng wéi kūn
  - time: 00:07.95
    text: 鲲之大，不知其几千里也；
    pinyin: kūn zhī dà bù zhī qí jǐ qiān lǐ yě
  - time: 00:12.78
    text: 化而为鸟，其名为鹏。
    pinyin: huà ér wéi niǎo qí míng wéi péng
  - time: 00:17.27
    text: 鹏之背，不知其几千里也；
    pinyin: péng zhī bèi bù zhī qí jǐ qiān lǐ yě
  - time: 00:22.11
    text: 怒而飞，其翼若垂天之云。
    pinyin: nù ér fēi qí yì ruò chuí tiān zhī yún
  - time: 00:27.57
    text: 是鸟也，海运则将徙于南冥。
    pinyin: shì niǎo yě hǎi yùn zé jiāng xǐ yú nán míng
  - time: 00:33.08
    text: 南冥者，天池也。
    pinyin: nán míng zhě tiān chí yě
  - time: 00:37.01
    text: 《齐谐》者，志怪者也。
    pinyin: qí xié zhě zhì guài zhě yě
  - time: 00:41.73
    text: 《谐》之言曰：
    pinyin: xié zhī yán yuē
  - time: 00:43.93
    text: “鹏之徙于南冥也，
    pinyin: péng zhī xǐ yú nán míng yě
  - time: 00:47.74
    text: 水击三千里，
    pinyin: shuǐ jī sān qiān lǐ
  - time: 00:50.41
    text: 抟扶摇而上者九万里，
    pinyin: tuán fú yáo ér shàng zhě jiǔ wàn lǐ
  - time: 00:54.58
    text: 去以六月息者也。”
    pinyin: qù yǐ liù yuè xī zhě yě
  - time: 00:58.01
    text: 野马也，尘埃也，
    pinyin: yé mǎ yě chén āi yě
  - time: 01:02.13
    text: 生物之以息相吹也。
    pinyin: shēng wù zhī yǐ xī xiāng chuī yě
  - time: 01:06.02
    text: 天之苍苍，其正色邪？
    pinyin: tiān zhī cāng cāng qí zhèng sè yé
  - time: 01:11.01
    text: 其远而无所至极邪？
    pinyin: qí yuǎn ér wú suǒ zhì jí yé
  - time: 01:15.07
    text: 其视下也，
    pinyin: qí shì xià yě
  - time: 01:17.87
    text: 亦若是则已矣。
    pinyin: yì ruò shì zé yǐ yǐ
  - time: 01:21.54
    text: 且夫水之积也不厚，
    pinyin: qiě fú shuǐ zhī jī yě bú hòu
  - time: 01:25.62
    text: 则其负大舟也无力。
    pinyin: zé qí fù dà zhōu yě wú lì
  - time: 01:28.82
    text: 覆杯水于坳堂之上，
    pinyin: fù bēi shuǐ yú ào táng zhī shàng
  - time: 01:32.47
    text: 则芥为之舟；
    pinyin: zé jiè wéi zhī zhōu
  - time: 01:35.22
    text: 置杯焉则胶，
    pinyin: zhì bēi yān zé jiāo
  - time: 01:38.05
    text: 水浅而舟大也。
    pinyin: shuǐ qiǎn ér zhōu dà yě
  - time: 01:41.29
    text: 风之积也不厚，
    pinyin: fēng zhī jī yě bú hòu
  - time: 01:43.91
    text: 则其负大翼也无力。
    pinyin: zé qí fù dà yì yě wú lì
  - time: 01:47.02
    text: 故九万里，
    pinyin: gù jiǔ wàn lǐ
  - time: 01:49.25
    text: 则风斯在下矣，
    pinyin: zé fēng sī zài xià yǐ
  - time: 01:52.54
    text: 而后乃今培风；
    pinyin: ér hòu nǎi jīn péi fēng
  - time: 01:55.95
    text: 背负青天，
    pinyin: bèi fù qīng tiān
  - time: 01:58.04
    text: 而莫之夭阏者，
    pinyin: ér mò zhī yāo è zhě
  - time: 02:00.71
    text: 而后乃今将图南。
    pinyin: ér hòu nǎi jīn jiāng tú nán
  - time: 02:05.25
    text: 蜩与学鸠笑之曰：
    pinyin: tiáo yǔ xué jiū xiào zhī yuē
  - time: 02:09.84
    text: “我决起而飞，
    pinyin: wǒ xuè qǐ ér fēi
  - time: 02:12.42
    text: 抢榆枋，
    pinyin: qiāng yú fāng
  - time: 02:14.04
    text: 时则不至，
    pinyin: shí zé bú zhì
  - time: 02:15.38
    text: 而控于地而已矣，
    pinyin: ér kòng yú dì ér yǐ yǐ
  - time: 02:18.27
    text: 奚以之九万里而南为？”
    pinyin: xī yǐ zhī jiǔ wàn lǐ ér nán wéi
  - time: 02:22.44
    text: 适莽苍者，
    pinyin: shì mǎng cāng zhě
  - time: 02:25.30
    text: 三餐而反，
    pinyin: sān cān ér fǎn
  - time: 02:27.06
    text: 腹犹果然；
    pinyin: fù yóu guǒ rán
  - time: 02:29.11
    text: 适百里者，
    pinyin: shì bǎi lǐ zhě
  - time: 02:31.14
    text: 宿舂粮；
    pinyin: sù chōng liáng
  - time: 02:32.52
    text: 适千里者，
    pinyin: shì qiān lǐ zhě
  - time: 02:34.77
    text: 三月聚粮。
    pinyin: sān yuè jù liáng
  - time: 02:36.82
    text: 之二虫又何知！
    pinyin: zhī èr chóng yòu hé zhī
  - time: 02:40.54
    text: 小知不及大知，
    pinyin: xiǎo zhì bù jí dà zhì
  - time: 02:43.63
    text: 小年不及大年。
    pinyin: xiǎo nián bù jí dà nián
  - time: 02:46.40
    text: 奚以知其然也？
    pinyin: xī yǐ zhī qí rán yě
  - time: 02:49.37
    text: 朝菌不知晦朔，
    pinyin: zhāo jūn bù zhī huì shuò
  - time: 02:52.17
    text: 蟪蛄不知春秋，
    pinyin: huì gū bù zhī chūn qiū
  - time: 02:55.00
    text: 此小年也。
    pinyin: cǐ xiǎo nián yě
  - time: 02:57.34
    text: 楚之南有冥灵者，
    pinyin: chǔ zhī nán yǒu míng líng zhě
  - time: 03:00.58
    text: 以五百岁为春，
    pinyin: yǐ wǔ bǎi suì wéi chūn
  - time: 03:03.12
    text: 五百岁为秋；
    pinyin: wǔ bǎi suì wéi qiū
  - time: 03:05.66
    text: 上古有大椿者，
    pinyin: shàng gǔ yǒu dà chūn zhě
  - time: 03:08.57
    text: 以八千岁为春，
    pinyin: yǐ bā qiān suì wéi chūn
  - time: 03:11.10
    text: 八千岁为秋。
    pinyin: bā qiān suì wéi qiū
  - time: 03:13.40
    text: 而彭祖乃今以久特闻，
    pinyin: ér péng zǔ nǎi jīn yǐ jiǔ tè wén
  - time: 03:17.72
    text: 众人匹之，
    pinyin: zhòng rén pǐ zhī
  - time: 03:19.90
    text: 不亦悲乎？
    pinyin: bù yì bēi hū
  - time: 03:22.60
    text: 汤之问棘也是已：
    pinyin: tāng zhī wèn jí yě shì yǐ
  - time: 03:26.66
    text: “穷发之北，
    pinyin: qióng fà zhī běi
  - time: 03:28.81
    text: 有冥海者，
    pinyin: yǒu míng hǎi zhě
  - time: 03:30.91
    text: 天池也。
    pinyin: tiān chí yě
  - time: 03:32.73
    text: 有鱼焉，
    pinyin: yǒu yú yān
  - time: 03:34.51
    text: 其广数千里，
    pinyin: qí guǎng shù qiān lǐ
  - time: 03:36.73
    text: 未有知其修者，
    pinyin: wèi yǒu zhī qí xiū zhě
  - time: 03:39.45
    text: 其名为鲲。
    pinyin: qí míng wéi kūn
  - time: 03:42.06
    text: 有鸟焉，
    pinyin: yǒu niǎo yān
  - time: 03:43.71
    text: 其名为鹏，
    pinyin: qí míng wéi péng
  - time: 03:45.43
    text: 背若泰山，
    pinyin: bèi ruò tài shān
  - time: 03:47.44
    text: 翼若垂天之云；
    pinyin: yì ruò chuí tiān zhī yún
  - time: 03:50.17
    text: 抟扶摇羊角而上者九万里，
    pinyin: tuán fú yáo yáng jiǎo ér shàng zhě jiǔ wàn lǐ
  - time: 03:55.46
    text: 绝云气，负青天，
    pinyin: jué yún qì fù qīng tiān
  - time: 03:58.72
    text: 然后图南，
    pinyin: rán hòu tú nán
  - time: 04:00.82
    text: 且适南冥也。
    pinyin: qiě shì nán míng yě
  - time: 04:03.39
    text: 斥鷃笑之曰：
    pinyin: chì yàn xiào zhī yuē
  - time: 04:06.79
    text: ‘彼且奚适也？
    pinyin: bǐ qiě xī shì yě
  - time: 04:09.45
    text: 我腾跃而上，
    pinyin: wǒ téng yuè ér shàng
  - time: 04:11.91
    text: 不过数仞而下，
    pinyin: bú guò shù rèn ér xià
  - time: 04:14.36
    text: 翱翔蓬蒿之间，
    pinyin: áo xiáng péng hāo zhī jiān
  - time: 04:17.09
    text: 此亦飞之至也。
    pinyin: cǐ yì fēi zhī zhì yě
  - time: 04:19.88
    text: 而彼且奚适也？’”
    pinyin: ér bǐ qiě xī shì yě
  - time: 04:22.80
    text: 此小大之辩也。
    pinyin: cǐ xiǎo dà zhī biàn yě
  - time: 04:26.24
    text: 故夫知效一官、
    pinyin: gù fú zhì xiào yì guān
  - time: 04:29.64
    text: 行比一乡、
    pinyin: xìng bì yì xiāng
  - time: 04:31.51
    text: 德合一君、
    pinyin: dé hé yì jūn
  - time: 04:33.50
    text: 能征一国者，
    pinyin: néng zhēng yì guó zhě
  - time: 04:35.60
    text: 其自视也亦若此矣。
    pinyin: qí zì shì yě yì ruò cǐ yǐ
  - time: 04:39.97
    text: 而宋荣子犹然笑之。
    pinyin: ér sòng róng zǐ yóu rán xiào zhī
  - time: 04:43.88
    text: 且举世而誉之而不加劝，
    pinyin: qiě jǔ shì ér yù zhī ér bù jiā quàn
  - time: 04:48.81
    text: 举世而非之而不加沮，
    pinyin: jǔ shì ér fēi zhī ér bù jiā jǔ
  - time: 04:52.92
    text: 定乎内外之分，
    pinyin: dìng hū nèi wài zhī fèn
  - time: 04:55.39
    text: 辩乎荣辱之境，
    pinyin: biàn hū róng rǔ zhī jìng
  - time: 04:57.93
    text: 斯已矣。
    pinyin: sī yí yǐ
  - time: 05:00.08
    text: 彼其于世，未数数然也。
    pinyin: bǐ qí yú shì wèi shuò shuò rán yě
  - time: 05:04.39
    text: 虽然，犹有未树也。
    pinyin: suī rán yóu yǒu wèi shù yě
  - time: 05:08.33
    text: 夫列子御风而行，泠然善也，
    pinyin: fú liè zǐ yù fēng ér xíng líng rán shàn yě
  - time: 05:13.97
    text: 旬有五日而后反。
    pinyin: xún yòu wǔ rì ér hòu fǎn
  - time: 05:17.59
    text: 彼于致福者，未数数然也。
    pinyin: bǐ yú zhì fú zhě wèi shuò shuò rán yě
  - time: 05:22.07
    text: 此虽免乎行，犹有所待者也。
    pinyin: cǐ suī miǎn hū xíng yóu yǒu suǒ dài zhě yě
  - time: 05:27.79
    text: 若夫乘天地之正，
    pinyin: ruò fú chéng tiān dì zhī zhèng
  - time: 05:31.21
    text: 而御六气之辩，
    pinyin: ér yù liù qì zhī biàn
  - time: 05:33.60
    text: 以游无穷者，
    pinyin: yǐ yóu wú qióng zhě
  - time: 05:35.47
    text: 彼且恶乎待哉？
    pinyin: bǐ qiě wū hū dài zāi
  - time: 05:38.73
    text: 故曰：
    pinyin: gù yuē
  - time: 05:40.45
    text: 至人无己，
    pinyin: zhì rén wú jǐ
  - time: 05:42.58
    text: 神人无功，
    pinyin: shén rén wú gōng
  - time: 05:44.03
    text: 圣人无名。
    pinyin: shèng rén wú míng
  - time: 05:46.63
    text: 尧让天下于许由曰：
    pinyin: yáo ràng tiān xià yú xǔ yóu yuē
  - time: 05:51.25
    text: “日月出矣，而爝火不息；
    pinyin: rì yuè chū yǐ ér jué huǒ bù xī
  - time: 05:55.74
    text: 其于光也，不亦难乎？
    pinyin: qí yú guāng yě bú yì nán hū
  - time: 05:59.17
    text: 时雨降矣，而犹浸灌；
    pinyin: shí yǔ jiàng yǐ ér yóu jìn guàn
  - time: 06:02.73
    text: 其于泽也，不亦劳乎？
    pinyin: qí yú zé yě bú yì láo hū
  - time: 06:06.38
    text: 夫子立而天下治，
    pinyin: fū zǐ lì ér tiān xià zhì
  - time: 06:09.65
    text: 而我犹尸之；
    pinyin: ér wǒ yóu shī zhī
  - time: 06:12.21
    text: 吾自视缺然，
    pinyin: wú zì shì quē rán
  - time: 06:14.85
    text: 请致天下。”
    pinyin: qǐng zhì tiān xià
  - time: 06:17.47
    text: 许由曰：
    pinyin: xǔ yóu yuē
  - time: 06:19.70
    text: “子治天下，
    pinyin: zǐ zhì tiān xià
  - time: 06:22.09
    text: 天下既已治也；
    pinyin: tiān xià jì yǐ zhì yě
  - time: 06:24.62
    text: 而我犹代子，
    pinyin: ér wǒ yóu dài zǐ
  - time: 06:27.05
    text: 吾将为名乎？
    pinyin: wú jiāng wèi míng hū
  - time: 06:29.47
    text: 名者，实之宾也；
    pinyin: míng zhě shí zhī bīn yě
  - time: 06:32.64
    text: 吾将为宾乎？
    pinyin: wú jiāng wéi bīn hū
  - time: 06:35.30
    text: 鹪鹩巢于深林，不过一枝；
    pinyin: jiāo liáo cháo yú shēn lín bú guò yì zhī
  - time: 06:40.32
    text: 偃鼠饮河，不过满腹。
    pinyin: yǎn shǔ yǐn hé bú guò mǎn fù
  - time: 06:44.01
    text: 归休乎君，予无所用天下为！
    pinyin: guī xiū hū jūn yǔ wú suǒ yòng tiān xià wéi
  - time: 06:50.00
    text: 庖人虽不治庖，
    pinyin: páo rén suī bú zhì páo
  - time: 06:53.06
    text: 尸祝不越樽俎而代之矣！”
    pinyin: shī zhù bú yuè zūn zǔ ér dài zhī yǐ
  - time: 06:57.35
    text: 肩吾问于连叔曰：
    pinyin: jiān wú wèn yú lián shū yuē
  - time: 07:01.46
    text: “吾闻言于接舆，
    pinyin: wú wén yán yú jiē yú
  - time: 07:04.45
    text: 大而无当，
    pinyin: dà ér wú dāng
  - time: 07:06.07
    text: 往而不反。
    pinyin: wǎng ér bù fǎn
  - time: 07:07.92
    text: 吾惊怖其言。
    pinyin: wú jīng bù qí yán
  - time: 07:10.50
    text: 犹河汉而无极也；
    pinyin: yóu hé hàn ér wú jí yě
  - time: 07:13.92
    text: 大有径庭，
    pinyin: dà yǒu jìng tíng
  - time: 07:15.80
    text: 不近人情焉。”
    pinyin: bú jìn rén qíng yān
  - time: 07:18.41
    text: 连叔曰：
    pinyin: lián shū yuē
  - time: 07:20.93
    text: “其言谓何哉？”
    pinyin: qí yán wèi hé zāi
  - time: 07:23.92
    text: 曰：
    pinyin: yuē
  - time: 07:25.91
    text: “藐姑射之山，
    pinyin: miǎo gū yè zhī shān
  - time: 07:28.45
    text: 有神人居焉。
    pinyin: yǒu shén rén jū yān
  - time: 07:30.77
    text: 肌肤若冰雪，
    pinyin: jī fū ruò bīng xuě
  - time: 07:33.55
    text: 淖约若处子，
    pinyin: chuò yuē ruò chǔ zǐ
  - time: 07:36.35
    text: 不食五谷，
    pinyin: bù shí wǔ gǔ
  - time: 07:38.21
    text: 吸风饮露，
    pinyin: xī fēng yǐn lù
  - time: 07:40.18
    text: 乘云气，御飞龙，
    pinyin: chéng yún qì yù fēi lóng
  - time: 07:43.13
    text: 而游乎四海之外；
    pinyin: ér yóu hū sì hǎi zhī wài
  - time: 07:46.12
    text: 其神凝，
    pinyin: qí shén níng
  - time: 07:48.14
    text: 使物不疵疠而年谷熟。
    pinyin: shǐ wù bù cī lì ér nián gǔ shú
  - time: 07:52.35
    text: 吾以是狂而不信也。”
    pinyin: wú yǐ shì kuáng ér bù xìn yě
  - time: 07:56.35
    text: 连叔曰：
    pinyin: lián shū yuē
  - time: 07:58.76
    text: “然。
    pinyin: rán
  - time: 08:00.35
    text: 瞽者无以与乎文章之观，
    pinyin: gǔ zhě wú yǐ yù hū wén zhāng zhī guān
  - time: 08:04.60
    text: 聋者无以与乎钟鼓之声。
    pinyin: lóng zhě wú yǐ yù hū zhōng gǔ zhī shēng
  - time: 08:08.84
    text: 岂唯形骸有聋盲哉？
    pinyin: qǐ wéi xíng hái yǒu lóng máng zāi
  - time: 08:12.68
    text: 夫知亦有之！
    pinyin: fú zhì yì yǒu zhī
  - time: 08:15.36
    text: 是其言也，
    pinyin: shì qí yán yě
  - time: 08:17.78
    text: 犹时女也。
    pinyin: yóu shì nǚ yě
  - time: 08:19.77
    text: 之人也，之德也，
    pinyin: zhī rén yě zhī dé yě
  - time: 08:22.74
    text: 将旁礴万物以为一，
    pinyin: jiāng páng bó wàn wù yǐ wéi yī
  - time: 08:26.52
    text: 世蕲乎乱，
    pinyin: shì qí hū luàn
  - time: 08:29.17
    text: 孰弊弊焉以天下为事！
    pinyin: shú bì bì yān yǐ tiān xià wéi shì
  - time: 08:33.69
    text: 之人也，物莫之伤：
    pinyin: zhī rén yě wù mò zhī shāng
  - time: 08:37.43
    text: 大浸稽天而不溺，
    pinyin: dà jìn jī tiān ér bù nì
  - time: 08:40.80
    text: 大旱金石流，
    pinyin: dà hàn jīn shí liú
  - time: 08:42.92
    text: 土山焦而不热。
    pinyin: tǔ shān jiāo ér bù rè
  - time: 08:45.79
    text: 是其尘垢秕糠，
    pinyin: shì qí chén gòu bǐ kāng
  - time: 08:48.77
    text: 将犹陶铸尧舜者也，
    pinyin: jiāng yóu táo zhù yáo shùn zhě yě
  - time: 08:52.24
    text: 孰肯以物为事？”
    pinyin: shú kěn yǐ wù wéi shì
  - time: 08:55.44
    text: 宋人资章甫而适诸越，
    pinyin: sòng rén zī zhāng fǔ ér shì zhū yuè
  - time: 09:00.72
    text: 越人断发文身，无所用之。
    pinyin: yuè rén duàn fà wén shēn wú suǒ yòng zhī
  - time: 09:05.27
    text: 尧治天下之民，
    pinyin: yáo zhì tiān xià zhī mín
  - time: 09:08.32
    text: 平海内之政，
    pinyin: píng hǎi nèi zhī zhèng
  - time: 09:10.26
    text: 往见四子藐姑射之山，
    pinyin: wǎng jiàn sì zǐ miǎo gū yè zhī shān
  - time: 09:14.78
    text: 汾水之阳，
    pinyin: fén shuǐ zhī yáng
  - time: 09:16.68
    text: 窅然丧其天下焉。
    pinyin: yǎo rán sàng qí tiān xià yān
  - time: 09:20.56
    text: 惠子谓庄子曰：
    pinyin: huì zǐ wèi zhuāng zǐ yuē
  - time: 09:24.81
    text: “魏王贻我大瓠之种，
    pinyin: wèi wáng yí wǒ dà hù zhī zhǒng
  - time: 09:28.91
    text: 我树之成，
    pinyin: wǒ shù zhī chéng
  - time: 09:30.95
    text: 而实五石。
    pinyin: ér shí wǔ dàn
  - time: 09:32.71
    text: 以盛水浆，
    pinyin: yǐ chéng shuǐ jiāng
  - time: 09:34.82
    text: 其坚不能自举也。
    pinyin: qí jiān bù néng zì jǔ yě
  - time: 09:37.81
    text: 剖之以为瓢，
    pinyin: pōu zhī yǐ wéi piáo
  - time: 09:40.52
    text: 则瓠落无所容。
    pinyin: zé huò luò wú suǒ róng
  - time: 09:43.48
    text: 非不呺然大也，
    pinyin: fēi bù xiāo rán dà yě
  - time: 09:46.75
    text: 吾为其无用而掊之。”
    pinyin: wú wèi qí wú yòng ér pǒu zhī
  - time: 09:51.00
    text: 庄子曰：
    pinyin: zhuāng zǐ yuē
  - time: 09:53.37
    text: “夫子固拙于用大矣。
    pinyin: fū zǐ gù zhuō yú yòng dà yǐ
  - time: 09:57.44
    text: 宋人有善为不皲手之药者，
    pinyin: sòng rén yǒu shàn wéi bù jūn shǒu zhī yào zhě
  - time: 10:02.21
    text: 世世以洴澼絖为事。
    pinyin: shì shì yǐ píng pì kuàng wéi shì
  - time: 10:05.96
    text: 客闻之，
    pinyin: kè wén zhī
  - time: 10:07.74
    text: 请买其方百金。
    pinyin: qǐng mǎi qí fāng bǎi jīn
  - time: 10:10.47
    text: 聚族而谋曰：
    pinyin: jù zú ér móu yuē
  - time: 10:12.85
    text: ‘我世世为洴澼絖，
    pinyin: wǒ shì shì wéi píng pì kuàng
  - time: 10:15.84
    text: 不过数金，
    pinyin: bú guò shù jīn
  - time: 10:17.94
    text: 今一朝而鬻技百金，
    pinyin: jīn yī zhāo ér yù jì bǎi jīn
  - time: 10:21.88
    text: 请与之。’
    pinyin: qǐng yǔ zhī
  - time: 10:23.96
    text: 客得之，
    pinyin: kè dé zhī
  - time: 10:25.87
    text: 以说吴王。
    pinyin: yǐ shuì wú wáng
  - time: 10:27.79
    text: 越有难，
    pinyin: yuè yǒu nàn
  - time: 10:29.43
    text: 吴王使之将，
    pinyin: wú wáng shǐ zhī jiàng
  - time: 10:31.42
    text: 冬，
    pinyin: dōng
  - time: 10:32.87
    text: 与越人水战，
    pinyin: yǔ yuè rén shuǐ zhàn
  - time: 10:34.88
    text: 大败越人。
    pinyin: dà bài yuè rén
  - time: 10:36.74
    text: 裂地而封之。
    pinyin: liè dì ér fēng zhī
  - time: 10:39.37
    text: 能不皲手一也，
    pinyin: néng bù jūn shǒu yī yě
  - time: 10:42.63
    text: 或以封，
    pinyin: huò yǐ fēng
  - time: 10:44.16
    text: 或不免于洴澼絖，
    pinyin: huò bù miǎn yú píng pì kuàng
  - time: 10:46.79
    text: 则所用之异也。
    pinyin: zé suǒ yòng zhī yì yě
  - time: 10:50.07
    text: 今子有五石之瓠，
    pinyin: jīn zǐ yóu wǔ dàn zhī hù
  - time: 10:53.52
    text: 何不虑以为大樽，
    pinyin: hé bù lǜ yǐ wéi dà zūn
  - time: 10:56.39
    text: 而浮于江湖，
    pinyin: ér fú yú jiāng hú
  - time: 10:58.67
    text: 而忧其瓠落无所容？
    pinyin: ér yōu qí huò luò wú suǒ róng
  - time: 11:02.79
    text: 则夫子犹有蓬之心也夫！”
    pinyin: zé fū zǐ yóu yǒu péng zhī xīn yě fú
  - time: 11:07.90
    text: 惠子谓庄子曰：
    pinyin: huì zǐ wèi zhuāng zǐ yuē
  - time: 11:12.03
    text: “吾有大树，
    pinyin: wú yǒu dà shù
  - time: 11:13.91
    text: 人谓之樗。
    pinyin: rén wèi zhī chū
  - time: 11:15.91
    text: 其大本拥肿而不中绳墨，
    pinyin: qí dà běn yōng zhǒng ér bù zhòng shéng mò
  - time: 11:20.46
    text: 其小枝卷曲而不中规矩，
    pinyin: qí xiǎo zhī juǎn qū ér bù zhòng guī jǔ
  - time: 11:24.99
    text: 立之途，
    pinyin: lì zhī tú
  - time: 11:26.76
    text: 匠者不顾。
    pinyin: jiàng zhě bú gù
  - time: 11:28.42
    text: 今子之言，
    pinyin: jīn zǐ zhī yán
  - time: 11:30.85
    text: 大而无用，
    pinyin: dà ér wú yòng
  - time: 11:32.57
    text: 众所同去也。”
    pinyin: zhòng suǒ tóng qù yě
  - time: 11:35.26
    text: 庄子曰：
    pinyin: zhuāng zǐ yuē
  - time: 11:37.37
    text: “子独不见狸狌乎？
    pinyin: zǐ dú bú jiàn lí shēng hū
  - time: 11:40.82
    text: 卑身而伏，以候敖者；
    pinyin: bēi shēn ér fú yǐ hòu áo zhě
  - time: 11:44.56
    text: 东西跳梁，不辟高下；
    pinyin: dōng xī tiào liáng bú bì gāo xià
  - time: 11:48.60
    text: 中于机辟，死于罔罟。
    pinyin: zhòng yú jī bì sǐ yú wǎng gǔ
  - time: 11:52.34
    text: 今夫斄牛，其大若垂天之云。
    pinyin: jīn fú lí niú qí dà ruò chuí tiān zhī yún
  - time: 11:58.00
    text: 此能为大矣，而不能执鼠。
    pinyin: cǐ néng wéi dà yǐ ér bù néng zhí shǔ
  - time: 12:03.05
    text: 今子有大树，患其无用，
    pinyin: jīn zǐ yǒu dà shù huàn qí wú yòng
  - time: 12:07.52
    text: 何不树之于无何有之乡，
    pinyin: hé bú shù zhī yú wú hé yǒu zhī xiāng
  - time: 12:11.25
    text: 广莫之野，
    pinyin: guǎng mò zhī yě
  - time: 12:13.18
    text: 彷徨乎无为其侧，
    pinyin: páng huáng hū wú wéi qí cè
  - time: 12:16.69
    text: 逍遥乎寝卧其下。
    pinyin: xiāo yáo hū qǐn wò qí xià
  - time: 12:20.13
    text: 不夭斤斧，
    pinyin: bù yāo jīn fǔ
  - time: 12:22.17
    text: 物无害者，
    pinyin: wù wú hài zhě
  - time: 12:23.93
    text: 无所可用，
    pinyin: wú suǒ kě yòng
  - time: 12:26.31
    text: 安所困苦哉！”
    pinyin: ān suǒ kùn kǔ zāi
