key: xin-jing
sentences:
  - time: 00:00.87
    text: 心经
    pinyin: xīn jīng
  - time: 00:03.64
    text: 观自在菩萨
    pinyin: guān zì zài pú sà
  - time: 00:06.50
    text: 行深般若波罗蜜多时
    pinyin: xíng shēn bō rě bō luó mì duō shí
  - time: 00:10.51
    text: 照见五蕴皆空
    pinyin: zhào jiàn wǔ yùn jiē kōng
  - time: 00:13.71
    text: 度一切苦厄
    pinyin: dù yí qiè kǔ è
  - time: 00:17.23
    text: 舍利子
    pinyin: shè lì zǐ
  - time: 00:19.82
    text: 色不异空
    pinyin: sè bù yì kōng
  - time: 00:22.04
    text: 空不异色
    pinyin: kōng bù yì sè
  - time: 00:24.32
    text: 色即是空
    pinyin: sè jí shì kōng
  - time: 00:26.86
    text: 空即是色
    pinyin: kōng jí shì sè
  - time: 00:29.57
    text: 受想行识
    pinyin: shòu xiǎng xíng shí
  - time: 00:32.42
    text: 亦复如是
    pinyin: yì fù rú shì
  - time: 00:35.25
    text: 舍利子
    pinyin: shè lì zǐ
  - time: 00:37.19
    text: 是诸法空相
    pinyin: shì zhū fǎ kōng xiàng
  - time: 00:40.05
    text: 不生不灭
    pinyin: bù shēng bú miè
  - time: 00:42.35
    text: 不垢不净
    pinyin: bú gòu bú jìng
  - time: 00:44.46
    text: 不增不减
    pinyin: bù zēng bù jiǎn
  - time: 00:47.80
    text: 是故空中无色
    pinyin: shì gù kōng zhōng wú sè
  - time: 00:51.35
    text: 无受想行识
    pinyin: wú shòu xiǎng xíng shí
  - time: 00:54.53
    text: 无眼耳鼻舌身意
    pinyin: wú yǎn ěr bí shé shēn yì
  - time: 00:58.68
    text: 无色声香味触法
    pinyin: wú sè shēng xiāng wèi chù fǎ
  - time: 01:03.79
    text: 无眼界
    pinyin: wú yǎn jiè
  - time: 01:05.52
    text: 乃至无意识界
    pinyin: nǎi zhì wú yì shí jiè
  - time: 01:08.39
    text: 无无明
    pinyin: wú wú míng
  - time: 01:10.51
    text: 亦无无明尽
    pinyin: yì wú wú míng jìn
  - time: 01:13.18
    text: 乃至无老死
    pinyin: nǎi zhì wú lǎo sǐ
  - time: 01:16.20
    text: 亦无老死尽
    pinyin: yì wú lǎo sǐ jìn
  - time: 01:18.69
    text: 无苦集灭道
    pinyin: wú kǔ jí miè dào
  - time: 01:22.01
    text: 无智亦无得
    pinyin: wú zhì yì wú dé
  - time: 01:25.98
    text: 以无所得故
    pinyin: yǐ wú suǒ dé gù
  - time: 01:28.66
    text: 菩提萨埵
    pinyin: pú tí sà duǒ
  - time: 01:30.83
    text: 依般若波罗蜜多故
    pinyin: yī bō rě bō luó mì duō gù
  - time: 01:34.69
    text: 心无挂碍
    pinyin: xīn wú guà ài
  - time: 01:37.14
    text: 无挂碍故
    pinyin: wú guà ài gù
  - time: 01:39.60
    text: 无有恐怖
    pinyin: wú yǒu kǒng bù
  - time: 01:42.30
    text: 远离颠倒梦想
    pinyin: yuǎn lí diān dǎo mèng xiǎng
  - time: 01:45.63
    text: 究竟涅槃
    pinyin: jiū jìng niè pán
  - time: 01:48.58
    text: 三世诸佛
    pinyin: sān shì zhū fó
  - time: 01:51.01
    text: 依般若波罗蜜多故
    pinyin: yī bō rě bō luó mì duō gù
  - time: 01:54.51
    text: 得阿耨多罗三藐三菩提
    pinyin: dé ā nòu duō luó sān miǎo sān pú tí
  - time: 02:00.07
    text: 故知般若波罗蜜多
    pinyin: gù zhī bō rě bō luó mì duō
  - time: 02:04.16
    text: 是大神咒
    pinyin: shì dà shén zhòu
  - time: 02:06.26
    text: 是大明咒
    pinyin: shì dà míng zhòu
  - time: 02:08.58
    text: 是无上咒
    pinyin: shì wú shàng zhòu
  - time: 02:10.88
    text: 是无等等咒
    pinyin: shì wú děng děng zhòu
  - time: 02:13.43
    text: 能除一切苦
    pinyin: néng chú yí qiè kǔ
  - time: 02:15.98
    text: 真实不虚
    pinyin: zhēn shí bù xū
  - time: 02:18.85
    text: 故说般若波罗蜜多咒
    pinyin: gù shuō bō rě bō luó mì duō zhòu
  - time: 02:23.00
    text: 即说咒曰
    pinyin: jí shuō zhòu yuē
  - time: 02:25.37
    text: 揭谛揭谛
    pinyin: jiē dì jiē dì
  - time: 02:28.07
    text: 波罗揭谛
    pinyin: bō luó jiē dì
  - time: 02:30.26
    text: 波罗僧揭谛
    pinyin: bō luó sēng jiē dì
  - time: 02:32.62
    text: 菩提萨婆诃
    pinyin: pú tí sà pó hē
